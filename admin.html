<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Vibe Kicks</title><style>
:root{
--bg:#090909;
--card:#151515;
--accent:#f2a900;
--text:#fff;
--muted:#999;
--line:#292929;
--green:#25d366;
--red:#ff5555;
--blue:#3b82f6;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
gap:15px;
}

h1{
margin:0;
font-size:28px;
}

.voltar{
color:var(--accent);
text-decoration:none;
font-weight:bold;
}

.add-button{
width:100%;
background:var(--accent);
color:#000;
border:0;
padding:15px;
border-radius:9px;
font-size:16px;
font-weight:900;
cursor:pointer;
}

.form{
display:none;
background:var(--card);
border:1px solid var(--line);
padding:22px;
border-radius:14px;
margin-top:20px;
}

.form.show{
display:block;
}

h2{
margin-top:0;
}

label{
display:block;
margin-top:16px;
margin-bottom:7px;
font-weight:bold;
}

input,
select{
width:100%;
padding:13px;
background:#222;
border:1px solid #444;
border-radius:8px;
color:#fff;
font-size:15px;
outline:none;
}

input:focus,
select:focus{
border-color:var(--accent);
}

.salvar{
width:100%;
margin-top:22px;
padding:15px;
background:var(--green);
color:#000;
border:0;
border-radius:9px;
font-weight:900;
font-size:15px;
cursor:pointer;
}

.salvar:disabled{
opacity:.6;
cursor:not-allowed;
}

.cancelar{
width:100%;
margin-top:10px;
padding:12px;
background:#292929;
color:#fff;
border:0;
border-radius:9px;
font-weight:bold;
cursor:pointer;
}

.status{
margin-top:18px;
padding:14px;
border-radius:8px;
display:none;
line-height:1.5;
word-break:break-word;
}

.status.show{
display:block;
}

.produtos{
margin-top:30px;
}

.produto{
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
padding:15px;
margin-bottom:12px;
}

.produto-nome{
font-size:18px;
font-weight:bold;
}

.produto-info{
color:var(--muted);
font-size:14px;
margin-top:6px;
}

.tag{
display:inline-block;
background:var(--accent);
color:#000;
padding:4px 7px;
border-radius:5px;
font-size:11px;
font-weight:bold;
margin-top:8px;
}

.acoes{
display:flex;
gap:8px;
margin-top:14px;
}

.btn-editar,
.btn-excluir{
flex:1;
padding:11px;
border:0;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.btn-editar{
background:var(--blue);
color:#fff;
}

.btn-excluir{
background:var(--red);
color:#fff;
}

.sem-produtos{
color:#999;
text-align:center;
padding:20px;
}

@media(max-width:500px){

body{
padding:15px;
}

h1{
font-size:23px;
}

header{
align-items:flex-start;
flex-direction:column;
}

.acoes{
flex-direction:column;
}

}
</style></head><body><div class="container"><header>
<h1>⚡ VIBE KICKS</h1>
<a class="voltar" href="/">← Loja</a>
</header><button class="add-button" onclick="novoProduto()">
➕ ADICIONAR PRODUTO
</button><div class="form" id="formulario"><h2 id="tituloFormulario">📦 Novo produto</h2><label for="nome">Nome do tênis</label>
<input
id="nome"
type="text"
placeholder="Ex: Nike Air Max"

«»

<label for="preco">Preço</label>
<input
id="preco"
type="number"
step="0.01"
placeholder="299.90"

«»

<label for="precoAntigo">Preço antigo</label>
<input
id="precoAntigo"
type="number"
step="0.01"
placeholder="349.90"

«»

<label for="categoria">Categoria</label>

<select id="categoria">
<option value="masculino">Masculino</option>
<option value="feminino">Feminino</option>
</select><label for="tag">Etiqueta</label>

<select id="tag">
<option value="">Nenhuma</option>
<option value="OFERTA">OFERTA</option>
<option value="NOVO">NOVO</option>
</select><label for="imagem">URL da imagem</label>

<input
id="imagem"
type="url"
placeholder="https://..."

«»

<button
class="salvar"
id="botaoSalvar"
onclick="salvarProduto()"

«»

💾 SALVAR PRODUTO
</button>

<button
class="cancelar"
onclick="fecharFormulario()"

«»

CANCELAR
</button>

<div
class="status"
id="status"
></div></div><div class="produtos"><h2>📋 Produtos cadastrados</h2><div id="listaProdutos">
Carregando produtos...
</div></div></div><script>

const SUPABASE_URL =
'https://ravaircmbkotndfghilq.supabase.co';

const SUPABASE_KEY =
'sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C';

let produtoEditando = null;


/* =========================
   FORMULÁRIO
========================= */

function novoProduto(){

produtoEditando = null;

document.getElementById('tituloFormulario').textContent =
'📦 Novo produto';

document.getElementById('botaoSalvar').textContent =
'💾 SALVAR PRODUTO';

limparFormulario();

document.getElementById('formulario').classList.add('show');

window.scrollTo({
top:0,
behavior:'smooth'
});

}


function fecharFormulario(){

document
.getElementById('formulario')
.classList.remove('show');

produtoEditando = null;

}


function limparFormulario(){

document.getElementById('nome').value='';
document.getElementById('preco').value='';
document.getElementById('precoAntigo').value='';
document.getElementById('categoria').value='masculino';
document.getElementById('tag').value='';
document.getElementById('imagem').value='';

document.getElementById('status').className='status';
document.getElementById('status').innerHTML='';

}


/* =========================
   STATUS
========================= */

function mostrarStatus(mensagem,tipo){

const status =
document.getElementById('status');

status.innerHTML = mensagem;

status.className='status show';

if(tipo==='erro'){

status.style.background='#351515';
status.style.color='#ff7777';

}else{

status.style.background='#15351f';
status.style.color='#7cff9b';

}

}


/* =========================
   SALVAR / EDITAR
========================= */

async function salvarProduto(){

const botao =
document.getElementById('botaoSalvar');

const nome =
document.getElementById('nome').value.trim();

const preco =
document.getElementById('preco').value;

const precoAntigo =
document.getElementById('precoAntigo').value;

const categoria =
document.getElementById('categoria').value;

const tag =
document.getElementById('tag').value;

const imagem =
document.getElementById('imagem').value.trim();


if(!nome){

mostrarStatus(
'❌ Digite o nome do tênis.',
'erro'
);

return;

}


if(!preco){

mostrarStatus(
'❌ Digite o preço do tênis.',
'erro'
);

return;

}


botao.disabled=true;

botao.textContent='⏳ SALVANDO...';


const dados = {

name:nome,

price:Number(preco),

old:precoAntigo
?Number(precoAntigo)
:null,

cat:categoria,

tag:tag,

image:imagem

};


try{

let resposta;


if(produtoEditando){

/* EDITAR */

resposta = await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
encodeURIComponent(produtoEditando),

{

method:'PATCH',

headers:{

'apikey':SUPABASE_KEY,

'Content-Type':
'application/json',

'Prefer':
'return=representation'

},

body:JSON.stringify(dados)

}

);

}else{

/* NOVO PRODUTO */

resposta = await fetch(

SUPABASE_URL +
'/rest/v1/products',

{

method:'POST',

headers:{

'apikey':SUPABASE_KEY,

'Content-Type':
'application/json',

'Prefer':
'return=representation'

},

body:JSON.stringify(dados)

}

);


}


if(!resposta.ok){

const erro =
await resposta.text();

throw new Error(erro);

}


if(produtoEditando){

mostrarStatus(
'✅ Produto atualizado com sucesso!',
'sucesso'
);

}else{

mostrarStatus(
'✅ Produto cadastrado com sucesso!',
'sucesso'
);

}


produtoEditando=null;

document.getElementById('tituloFormulario')
.textContent='📦 Novo produto';

document.getElementById('botaoSalvar')
.textContent='💾 SALVAR PRODUTO';

limparFormulario();

carregarProdutos();


}catch(erro){

console.error(
'Erro Supabase:',
erro
);

mostrarStatus(

'❌ Erro ao salvar produto.<br><br>' +
erro.message,

'erro'

);

}


botao.disabled=false;

if(!produtoEditando){

botao.textContent=
'💾 SALVAR PRODUTO';

}

}


/* =========================
   CARREGAR PRODUTOS
========================= */

async function carregarProdutos(){

const lista =
document.getElementById('listaProdutos');

lista.innerHTML=
'⏳ Carregando produtos...';


try{

const resposta = await fetch(

SUPABASE_URL +
'/rest/v1/products?select=*&order=id.asc',

{

method:'GET',

headers:{

'apikey':SUPABASE_KEY

}

}

);


if(!resposta.ok){

const erro =
await resposta.text();

throw new Error(erro);

}


const produtos =
await resposta.json();


if(!produtos.length){

lista.innerHTML=
'<div class="sem-produtos">' +
'Nenhum produto cadastrado.' +
'</div>';

return;

}


lista.innerHTML =
produtos.map(produto=>{

const nome =
produto.name ||
produto.Name ||
'Produto sem nome';

const preco =
Number(produto.price||0)
.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);

const precoAntigo =
Number(produto.old||0)
.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);

return `

<div class="produto">

<div class="produto-nome">
${escapar(nome)}
</div>

<div class="produto-info">
💰 ${preco}
</div>

${produto.old ? `

<div class="produto-info">
🏷️ De: ${precoAntigo}
</div>

` : ''}

<div class="produto-info">
📂 ${escapar(produto.cat||'Sem categoria')}
</div>

${produto.tag ? `

<span class="tag">
${escapar(produto.tag)}
</span>

` : ''}

<div class="acoes">

<button
class="btn-editar"
onclick="editarProduto(${produto.id})"
>
✏️ EDITAR
</button>

<button
class="btn-excluir"
onclick="excluirProduto(${produto.id})"
>
🗑️ EXCLUIR
</button>

</div>

</div>

`;

}).join('');


}catch(erro){

console.error(
'Erro ao carregar:',
erro
);

lista.innerHTML=

'<p style="color:#ff7777">' +
'❌ Não foi possível carregar os produtos.' +
'<br><br>' +
escapar(erro.message) +
'</p>';

}

}


/* =========================
   EDITAR
========================= */

async function editarProduto(id){

try{

const resposta =
await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
encodeURIComponent(id) +
'&select=*',

{

headers:{

'apikey':SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


const dados =
await resposta.json();


if(!dados.length){

alert(
'Produto não encontrado.'
);

return;

}


const produto=dados[0];


produtoEditando=id;


document.getElementById('tituloFormulario')
.textContent='✏️ Editar produto';


document.getElementById('nome')
.value =
produto.name ||
produto.Name ||
'';


document.getElementById('preco')
.value =
produto.price || '';


document.getElementById('precoAntigo')
.value =
produto.old || '';


document.getElementById('categoria')
.value =
produto.cat || 'masculino';


document.getElementById('tag')
.value =
produto.tag || '';


document.getElementById('imagem')
.value =
produto.image || '';


document.getElementById('botaoSalvar')
.textContent=
'💾 ATUALIZAR PRODUTO';


document.getElementById('formulario')
.classList.add('show');


window.scrollTo({
top:0,
behavior:'smooth'
});


}catch(erro){

console.error(erro);

alert(
'❌ Erro ao abrir produto:\n\n' +
erro.message
);

}

}


/* =========================
   EXCLUIR
========================= */

async function excluirProduto(id){

const confirmar =
confirm(
'⚠️ Tem certeza que deseja excluir este produto?'
);


if(!confirmar){

return;

}


try{

const resposta =
await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
encodeURIComponent(id),

{

method:'DELETE',

headers:{

'apikey':SUPABASE_KEY

}

}

);


if(!resposta.ok){

const erro =
await resposta.text();

throw new Error(erro);

}


alert(
'✅ Produto excluído com sucesso!'
);


carregarProdutos();


}catch(erro){

console.error(erro);

alert(

'❌ Erro ao excluir produto:\n\n' +
erro.message

);

}

}


/* =========================
   SEGURANÇA BÁSICA DO TEXTO
========================= */

function escapar(valor){

return String(valor ?? '')

.replace(/&/g,'&amp;')

.replace(/</g,'&lt;')

.replace(/>/g,'&gt;')

.replace(/"/g,'&quot;')

.replace(/'/g,'&#039;');

}


/* =========================
   INICIAR
========================= */

carregarProdutos();

</script></body>
</html>
