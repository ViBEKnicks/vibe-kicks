<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Vibe Kicks</title>

<style>
body{
margin:0;
background:#090909;
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

h1{
margin-bottom:25px;
}

button{
background:#f2a900;
color:#000;
border:0;
padding:14px 20px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.form{
display:none;
background:#151515;
padding:20px;
border-radius:12px;
margin-top:20px;
}

.form.show{
display:block;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
box-sizing:border-box;
background:#222;
border:1px solid #444;
border-radius:7px;
color:#fff;
}

.salvar{
margin-top:20px;
width:100%;
}

.voltar{
display:inline-block;
margin-top:20px;
color:#f2a900;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ Painel VIBE KICKS</h1>

<button onclick="abrirFormulario()">
➕ ADICIONAR PRODUTO
</button>

<div class="form" id="formulario">

<h2>Novo produto</h2>

<label>Nome do tênis</label>
<input id="nome" type="text" placeholder="Ex: Nike Air Max">

<label>Preço</label>
<input id="preco" type="number" step="0.01" placeholder="299.90">

<label>Preço antigo</label>
<input id="precoAntigo" type="number" step="0.01" placeholder="349.90">

<label>Categoria</label>

<select id="categoria">
<option value="masculino">Masculino</option>
<option value="feminino">Feminino</option>
</select>

<label>Etiqueta</label>

<select id="tag">
<option value="">Nenhuma</option>
<option value="OFERTA">OFERTA</option>
<option value="NOVO">NOVO</option>
</select>

<label>URL da imagem</label>
<input id="imagem" type="text" placeholder="https://...">

<button class="salvar" onclick="salvarProduto()">
💾 SALVAR PRODUTO
</button>

</div>

<a class="voltar" href="/">
← Voltar para a loja
</a>

</div>

<script>

function abrirFormulario(){

document
.getElementById("formulario")
.classList.toggle("show");

}


function salvarProduto(){

const nome =
document.getElementById("nome").value.trim();

const preco =
document.getElementById("preco").value;

if(!nome || !preco){

alert("Preencha o nome e o preço.");

return;

}

alert(
"Formulário funcionando! Agora vamos conectar ao Supabase."
);

}

</script>

</body>
</html>
