<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vibe Kicks - Painel</title><style>

body{

}

}

button{

}

}

#formulario{

}

}

background:#333;

}

}

}

}

}

margin-top:7px;
}

margin-top:15px;
}

.editar{
background:#287be5;

}

}

</style></head><body><div class="container"><div id="avisoJS">
✅ PAINEL CARREGADO
</div><header><h1>⚡ VIBE KICKS</h1><a class="voltar" href="/">
← Loja
</a></header><button id="abrir">
➕ ADICIONAR PRODUTO
</button><div id="formulario"><h2 id="titulo">
📦 Novo produto
</h2><label>
Nome do tênis
</label><input
id="nome"
type="text"
placeholder="Ex: Nike Air Max"

«»

<label>
Preço
</label><input
id="preco"
type="number"
step="0.01"
placeholder="299.90"

«»

<label>
Preço antigo
</label><input
id="precoAntigo"
type="number"
step="0.01"
placeholder="349.90"

«»

<label>
Categoria
</label><select id="categoria"><option value="masculino">
Masculino
</option><option value="feminino">
Feminino
</option></select><label>
Etiqueta
</label><select id="tag"><option value="">
Nenhuma
</option><option value="OFERTA">
OFERTA
</option><option value="NOVO">
NOVO
</option></select><label>
URL da imagem
</label><input
id="imagem"
type="url"
placeholder="https://..."

«»

<button id="salvar">
💾 SALVAR PRODUTO
</button><button id="cancelar">
CANCELAR
</button><div id="mensagem"></div></div><h2>
📋 Produtos cadastrados
</h2><div id="lista">
⏳ Carregando produtos...
</div></div><script>

const SUPABASE_URL =
"https://ravaircmbkotndfghilq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";


let editando = null;


/* =========================
ABRIR FORMULÁRIO
========================= */

document
.getElementById("abrir")
.addEventListener("click", function(){

document
.getElementById("formulario")
.style.display = "block";

window.scrollTo({
top:0,
behavior:"smooth"
});

});


/* =========================
CANCELAR
========================= */

document
.getElementById("cancelar")
.addEventListener("click", function(){

document
.getElementById("formulario")
.style.display = "none";

editando=null;

});


/* =========================
MENSAGEM
========================= */

function mensagem(texto,erro){

const m =
document.getElementById("mensagem");

m.innerHTML=texto;

m.style.display="block";

if(erro){

m.style.background="#351515";

m.style.color="#ff7777";

}else{

m.style.background="#15351f";

m.style.color="#7cff9b";

}

}


/* =========================
SALVAR
========================= */

document
.getElementById("salvar")
.addEventListener("click", async function(){

const nome =
document.getElementById("nome")
.value
.trim();

const preco =
document.getElementById("preco")
.value;

const precoAntigo =
document.getElementById("precoAntigo")
.value;

const categoria =
document.getElementById("categoria")
.value;

const tag =
document.getElementById("tag")
.value;

const imagem =
document.getElementById("imagem")
.value
.trim();


if(!nome){

mensagem(
"❌ Digite o nome do tênis.",
true
);

return;

}


if(!preco){

mensagem(
"❌ Digite o preço.",
true
);

return;

}


const dados={

name:nome,

price:Number(preco),

old:
precoAntigo
?
Number(precoAntigo)
:
null,

cat:categoria,

tag:tag,

image:imagem

};


const botao=this;

botao.disabled=true;

botao.textContent="⏳ SALVANDO...";


try{

let resposta;


if(editando){

resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
editando,

{

method:"PATCH",

headers:{

"apikey":SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify(dados)

}

);

}else{

resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products",

{

method:"POST",

headers:{

"apikey":SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(dados)

}

);

}


if(!resposta.ok){

const erro =
await resposta.text();

throw new Error(erro);

}


mensagem(

editando
?
"✅ Produto atualizado com sucesso!"
:
"✅ Produto cadastrado com sucesso!"

);


limpar();

editando=null;

carregarProdutos();


}catch(erro){

console.error(erro);

mensagem(
"❌ ERRO:<br><br>" +
erro.message,
true
);

}


botao.disabled=false;

botao.textContent=
"💾 SALVAR PRODUTO";

});


/* =========================
LIMPAR
========================= */

function limpar(){

document.getElementById("nome").value="";

document.getElementById("preco").value="";

document.getElementById("precoAntigo").value="";

document.getElementById("categoria").value="masculino";

document.getElementById("tag").value="";

document.getElementById("imagem").value="";

}


/* =========================
CARREGAR
========================= */

async function carregarProdutos(){

const lista =
document.getElementById("lista");

try{

const resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?select=*&order=id.asc",

{

method:"GET",

headers:{

"apikey":SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


const produtos =
await resposta.json();


if(!produtos.length){

lista.innerHTML=
"📦 Nenhum produto cadastrado.";

return;

}


lista.innerHTML="";


produtos.forEach(function(p){

const nome =
p.name ||
p.Name ||
"Produto";


const preco =
Number(p.price||0)
.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);


const div =
document.createElement("div");

div.className="produto";


div.innerHTML=`

<div class="nome">
${escapar(nome)}
</div>

<div class="info">
💰 ${preco}
</div>

<div class="info">
📂 ${escapar(p.cat||"Sem categoria")}
</div>

${p.tag ? `

<div class="info">
🏷️ ${escapar(p.tag)}
</div>

` : ""}

<div class="acoes">

<button
class="editar"
data-id="${p.id}"
>
✏️ EDITAR
</button>

<button
class="excluir"
data-id="${p.id}"
>
🗑️ EXCLUIR
</button>

</div>

`;


div
.querySelector(".editar")
.addEventListener(
"click",
function(){

editarProduto(p.id);

}
);


div
.querySelector(".excluir")
.addEventListener(
"click",
function(){

excluirProduto(p.id);

}
);


lista.appendChild(div);

});


}catch(erro){

console.error(erro);

lista.innerHTML=

"❌ Erro ao carregar produtos:<br><br>" +

escapar(erro.message);

}

}


/* =========================
EDITAR
========================= */

async function editarProduto(id){

try{

const resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
id,

{

headers:{

"apikey":SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


const produtos =
await resposta.json();


if(!produtos.length){

alert("Produto não encontrado.");

return;

}


const p=produtos[0];


editando=id;


document.getElementById("nome").value =
p.name || p.Name || "";

document.getElementById("preco").value =
p.price || "";

document.getElementById("precoAntigo").value =
p.old || "";

document.getElementById("categoria").value =
p.cat || "masculino";

document.getElementById("tag").value =
p.tag || "";

document.getElementById("imagem").value =
p.image || "";


document.getElementById("titulo")
.textContent=
"✏️ Editar produto";


document.getElementById("salvar")
.textContent=
"💾 ATUALIZAR PRODUTO";


document.getElementById("formulario")
.style.display="block";


window.scrollTo({
top:0,
behavior:"smooth"
});


}catch(erro){

alert(
"❌ Erro ao editar:\n\n" +
erro.message
);

}

}


/* =========================
EXCLUIR
========================= */

async function excluirProduto(id){

if(!confirm(
"⚠️ Tem certeza que deseja excluir este produto?"
)){

return;

}


try{

const resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
id,

{

method:"DELETE",

headers:{

"apikey":SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


alert(
"✅ Produto excluído com sucesso!"
);


carregarProdutos();


}catch(erro){

alert(

"❌ Erro ao excluir:\n\n" +
erro.message

);

}

}


/* =========================
ESCAPAR TEXTO
========================= */

function escapar(valor){

return String(valor ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
INICIAR
========================= */

carregarProdutos();

</script></body></html>
