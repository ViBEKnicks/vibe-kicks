<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE KICKS - Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  background:#181818;
  border-bottom:2px solid #f5b400;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  color:#f5b400;
  font-size:21px;
  font-weight:bold;
}

header div{
  display:flex;
  gap:8px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 15px;
  font-weight:bold;
  cursor:pointer;
}

#btnLoja{
  background:#f5b400;
  color:#111;
}

#btnSair{
  background:#d62828;
  color:#fff;
}

main{
  max-width:950px;
  margin:auto;
  padding:20px;
}

.usuario{
  background:#1c1c1c;
  padding:12px;
  border-radius:8px;
  margin-bottom:20px;
  color:#ccc;
}

.box{
  background:#1b1b1b;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
  color:#f5b400;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  font-size:16px;
}

#btnSalvar{
  width:100%;
  margin-top:20px;
  background:#f5b400;
  color:#111;
  font-size:16px;
}

#btnCancelar{
  width:100%;
  margin-top:10px;
  background:#444;
  color:#fff;
  display:none;
}

#mensagem{
  display:none;
  padding:14px;
  border-radius:8px;
  margin-bottom:15px;
  word-break:break-word;
}

.ok{
  display:block!important;
  background:#14532d;
  color:#bbf7d0;
}

.erro{
  display:block!important;
  background:#7f1d1d;
  color:#fecaca;
}

#lista{
  min-height:80px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#aaa;
}

.produto{
  background:#252525;
  border-radius:10px;
  padding:15px;
  margin-bottom:12px;
  display:flex;
  gap:15px;
  align-items:center;
  flex-wrap:wrap;
}

.produto img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  background:#333;
}

.info{
  flex:1;
  min-width:200px;
}

.info h3{
  margin:0 0 8px;
}

.info p{
  margin:5px 0;
  color:#bbb;
}

.acoes{
  display:flex;
  gap:8px;
}

.editar{
  background:#2563eb;
  color:white;
}

.excluir{
  background:#dc2626;
  color:white;
}

#preview{
  display:none;
  width:160px;
  height:160px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

@media(max-width:600px){

  header{
    align-items:flex-start;
  }

  .logo{
    font-size:17px;
  }

  header div{
    flex-direction:column;
  }

  button{
    padding:10px;
  }

  .produto{
    align-items:flex-start;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    👟 VIBE KICKS — ADMIN
  </div>

  <div>

    <button id="btnLoja">
      🏪 LOJA
    </button>

    <button id="btnSair">
      🚪 SAIR
    </button>

  </div>

</header>


<main>

  <div class="usuario">
    🔐 Usuário:
    <strong id="emailUsuario">Verificando...</strong>
  </div>


  <div id="mensagem"></div>


  <div class="box">

    <h2 id="titulo">
      ➕ Adicionar produto
    </h2>

    <form id="formProduto">

      <label>Nome</label>

      <input
        id="nome"
        type="text"
        required
        placeholder="Nome do produto"
      >


      <label>Preço</label>

      <input
        id="preco"
        type="number"
        step="0.01"
        min="0"
        required
        placeholder="299.90"
      >


      <label>Preço antigo</label>

      <input
        id="old"
        type="number"
        step="0.01"
        min="0"
        placeholder="399.90"
      >


      <label>Categoria</label>

      <input
        id="cat"
        type="text"
        placeholder="Masculino"
      >


      <label>Tag</label>

      <input
        id="tag"
        type="text"
        placeholder="PROMOÇÃO"
      >


      <label>Foto</label>

      <input
        id="foto"
        type="file"
        accept="image/*"
      >


      <img id="preview">


      <button
        type="submit"
        id="btnSalvar"
      >
        💾 SALVAR PRODUTO
      </button>


      <button
        type="button"
        id="btnCancelar"
      >
        CANCELAR EDIÇÃO
      </button>

    </form>

  </div>


  <div class="box">

    <h2>📦 Produtos</h2>

    <div id="lista">

      <div class="loading">
        ⏳ Carregando produtos...
      </div>

    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
"https://ravaircmbkotndfghilq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

const BUCKET =
"produtos";


let token =
localStorage.getItem("vibe_access_token");

let editando = null;

let imagemAtual = "";


const $ = id =>
document.getElementById(id);


/* =========================
   MENSAGEM
========================= */

function mensagem(texto, erro=false){

  const m = $("mensagem");

  m.className = erro ? "erro" : "ok";

  m.textContent = texto;

  m.style.display = "block";

}


/* =========================
   VERIFICAR LOGIN
========================= */

async function verificarLogin(){

  if(!token){

    window.location.href =
      "login.html";

    return false;
  }

  try{

    const resposta =
      await fetch(
        SUPABASE_URL + "/auth/v1/user",
        {
          method:"GET",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + token
          }
        }
      );


    if(!resposta.ok){

      localStorage.removeItem(
        "vibe_access_token"
      );

      localStorage.removeItem(
        "vibe_refresh_token"
      );

      localStorage.removeItem(
        "vibe_user_email"
      );

      window.location.href =
        "login.html";

      return false;
    }


    const usuario =
      await resposta.json();


    $("emailUsuario").textContent =
      usuario.email || "Usuário";


    return true;

  }catch(e){

    mensagem(
      "Erro ao verificar login: " + e.message,
      true
    );

    return false;
  }

}


/* =========================
   BOTÃO LOJA
========================= */

$("btnLoja").addEventListener(
  "click",
  function(){

    window.location.href =
      "https://vibe-kicks.vercel.app/";

  }
);


/* =========================
   BOTÃO SAIR
========================= */

$("btnSair").addEventListener(
  "click",
  function(){

    localStorage.removeItem(
      "vibe_access_token"
    );

    localStorage.removeItem(
      "vibe_refresh_token"
    );

    localStorage.removeItem(
      "vibe_user_email"
    );

    window.location.href =
      "login.html";

  }
);


/* =========================
   CARREGAR PRODUTOS
========================= */

async function carregarProdutos(){

  const lista =
    $("lista");

  lista.innerHTML =
    '<div class="loading">⏳ Carregando produtos...</div>';


  const controlador =
    new AbortController();


  const tempo =
    setTimeout(
      function(){

        controlador.abort();

      },
      10000
    );


  try{

    const resposta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.asc",
        {
          method:"GET",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + token
          },

          signal:
            controlador.signal
        }
      );


    clearTimeout(tempo);


    if(!resposta.ok){

      const erro =
        await resposta.text();

      throw new Error(
        "Supabase " +
        resposta.status +
        ": " +
        erro
      );

    }


    const produtos =
      await resposta.json();


    window.produtos =
      produtos;


    if(!produtos.length){

      lista.innerHTML =
        '<div class="loading">📦 Nenhum produto cadastrado.</div>';

      return;
    }


    lista.innerHTML = "";


    produtos.forEach(
      function(p){

        const div =
          document.createElement("div");

        div.className =
          "produto";


        const imagem =
          p.image ||
          "https://via.placeholder.com/300";


        let preco =
          Number(p.price || 0)
          .toFixed(2)
          .replace(".",",");


        let antigo = "";


        if(
          p.Old !== null &&
          p.Old !== undefined &&
          p.Old !== ""
        ){

          antigo =
            "<p>🏷️ Antigo: R$ " +
            Number(p.Old)
            .toFixed(2)
            .replace(".",",") +
            "</p>";

        }


        div.innerHTML = `

          <img
            src="${imagem}"
            onerror="this.src='https://via.placeholder.com/300'"
          >

          <div class="info">

            <h3>${p.name || ""}</h3>

            <p>
              💰 R$ ${preco}
            </p>

            ${antigo}

            <p>
              📂 ${p.Cat || "-"}
            </p>

            <p>
              🔖 ${p.Tag || "-"}
            </p>

          </div>

          <div class="acoes">

            <button
              class="editar"
              data-id="${p.id}"
            >
              ✏️ EDITAR
            </button>

            <button
              class="excluir"
              data-id="${p.id}"
            >
              🗑️ EXCLUIR
            </button>

          </div>

        `;


        lista.appendChild(div);

      }
    );


    document
      .querySelectorAll(".editar")
      .forEach(
        b =>
        b.addEventListener(
          "click",
          () =>
            editar(Number(b.dataset.id))
        )
      );


    document
      .querySelectorAll(".excluir")
      .forEach(
        b =>
        b.addEventListener(
          "click",
          () =>
            excluir(Number(b.dataset.id))
        )
      );


  }catch(e){

    clearTimeout(tempo);


    console.error(e);


    if(e.name === "AbortError"){

      lista.innerHTML = `
        <div class="erro">
          ❌ O Supabase demorou mais de 10 segundos para responder.
          <br><br>
          Verifique a conexão e as permissões da tabela products.
          <br><br>
          <button onclick="carregarProdutos()">
            🔄 TENTAR NOVAMENTE
          </button>
        </div>
      `;

    }else{

      lista.innerHTML = `
        <div class="erro">
          ❌ ERRO AO CARREGAR PRODUTOS
          <br><br>
          ${e.message}
          <br><br>
          <button onclick="carregarProdutos()">
            🔄 TENTAR NOVAMENTE
          </button>
        </div>
      `;

    }

  }

}


/* =========================
   FOTO
========================= */

$("foto").addEventListener(
  "change",
  function(){

    const arquivo =
      this.files[0];

    if(!arquivo){

      $("preview").style.display =
        "none";

      return;
    }


    const leitor =
      new FileReader();


    leitor.onload =
      function(e){

        $("preview").src =
          e.target.result;

        $("preview").style.display =
          "block";

      };


    leitor.readAsDataURL(
      arquivo
    );

  }
);


/* =========================
   ENVIAR FOTO
========================= */

async function enviarFoto(){

  const arquivo =
    $("foto").files[0];


  if(!arquivo){

    return imagemAtual || "";

  }


  const nome =
    Date.now() +
    "-" +
    arquivo.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "-"
      );


  const resposta =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      nome,
      {

        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            "Bearer " + token,

          "Content-Type":
            arquivo.type,

          "x-upsert":
            "true"
        },

        body:arquivo

      }
    );


  if(!resposta.ok){

    throw new Error(
      "Erro ao enviar foto: " +
      await resposta.text()
    );

  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    nome
  );

}


/* =========================
   SALVAR
========================= */

$("formProduto")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const botao =
      $("btnSalvar");


    botao.disabled =
      true;


    botao.textContent =
      "⏳ SALVANDO...";


    try{

      const nome =
        $("nome").value.trim();


      const preco =
        Number($("preco").value);


      const old =
        $("old").value;


      const cat =
        $("cat").value.trim();


      const tag =
        $("tag").value.trim();


      if(!nome){

        throw new Error(
          "Digite o nome do produto."
        );

      }


      if(!preco){

        throw new Error(
          "Digite o preço."
        );

      }


      const imagem =
        await enviarFoto();


      const produto = {

        name:nome,

        price:preco,

        Cat:cat,

        Old:
          old === ""
          ? null
          : Number(old),

        Tag:tag,

        image:imagem

      };


      let resposta;


      if(editando){

        resposta =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/products?id=eq." +
            editando,
            {

              method:"PATCH",

              headers:{
                "apikey":SUPABASE_KEY,

                "Authorization":
                  "Bearer " + token,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"
              },

              body:
                JSON.stringify(produto)

            }
          );

      }else{

        resposta =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/products",
            {

              method:"POST",

              headers:{
                "apikey":SUPABASE_KEY,

                "Authorization":
                  "Bearer " + token,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"
              },

              body:
                JSON.stringify(produto)

            }
          );

      }


      if(!resposta.ok){

        throw new Error(
          await resposta.text()
        );

      }


      mensagem(
        editando
        ? "✅ Produto atualizado!"
        : "✅ Produto cadastrado!"
      );


      limpar();


      carregarProdutos();


    }catch(e){

      mensagem(
        "❌ " + e.message,
        true
      );

    }finally{

      botao.disabled =
        false;

      botao.textContent =
        "💾 SALVAR PRODUTO";

    }

  }
);


/* =========================
   EDITAR
========================= */

function editar(id){

  const p =
    window.produtos.find(
      x =>
        Number(x.id) === Number(id)
    );


  if(!p)return;


  editando =
    p.id;


  $("nome").value =
    p.name || "";


  $("preco").value =
    p.price || "";


  $("old").value =
    p.Old || "";


  $("cat").value =
    p.Cat || "";


  $("tag").value =
    p.Tag || "";


  imagemAtual =
    p.image || "";


  if(imagemAtual){

    $("preview").src =
      imagemAtual;

    $("preview").style.display =
      "block";

  }


  $("titulo").textContent =
    "✏️ Editar produto";


  $("btnSalvar").textContent =
    "💾 ATUALIZAR PRODUTO";


  $("btnCancelar").style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   CANCELAR
========================= */

$("btnCancelar")
.addEventListener(
  "click",
  limpar
);


function limpar(){

  $("formProduto").reset();

  editando =
    null;

  imagemAtual =
    "";


  $("titulo").textContent =
    "➕ Adicionar produto";


  $("btnSalvar").textContent =
    "💾 SALVAR PRODUTO";


  $("btnCancelar").style.display =
    "none";


  $("preview").style.display =
    "none";

}


/* =========================
   EXCLUIR
========================= */

async function excluir(id){

  if(
    !confirm(
      "Deseja realmente excluir este produto?"
    )
  ){
    return;
  }


  try{

    const resposta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {

          method:"DELETE",

          headers:{
            "apikey":SUPABASE_KEY,

            "Authorization":
              "Bearer " + token
          }

        }
      );


    if(!resposta.ok){

      throw new Error(
        await resposta.text()
      );

    }


    mensagem(
      "🗑️ Produto excluído!"
    );


    carregarProdutos();


  }catch(e){

    mensagem(
      "❌ " + e.message,
      true
    );

  }

}


/* =========================
   INICIAR
========================= */

(async function(){

  const entrou =
    await verificarLogin();


  if(entrou){

    carregarProdutos();

  }

})();

</script>

</body>
</html>
