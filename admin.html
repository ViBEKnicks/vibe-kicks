<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel Vibe Kicks</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#090909;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:700px;
margin:auto;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

h1{
font-size:26px;
margin:0;
}

.voltar{
color:#f2a900;
text-decoration:none;
font-weight:bold;
}

button{
cursor:pointer;
}

.add{
width:100%;
padding:16px;
border:0;
border-radius:10px;
background:#f2a900;
color:#000;
font-size:16px;
font-weight:bold;
}

.form{
display:none;
margin-top:20px;
padding:20px;
background:#151515;
border-radius:12px;
border:1px solid #292929;
}

.form.aberto{
display:block;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input,select{
width:100%;
padding:13px;
border-radius:8px;
border:1px solid #444;
background:#222;
color:white;
font-size:15px;
}

.salvar{
width:100%;
margin-top:20px;
padding:15px;
border:0;
border-radius:9px;
background:#25d366;
color:#000;
font-weight:bold;
font-size:15px;
}

.cancelar{
width:100%;
margin-top:10px;
padding:13px;
border:0;
border-radius:9px;
background:#333;
color:white;
font-weight:bold;
}

.status{
margin-top:15px;
padding:12px;
border-radius:8px;
display:none;
}

.status.mostrar{
display:block;
}

.produtos{
margin-top:30px;
}

.produto{
background:#151515;
border:1px solid #292929;
border-radius:12px;
padding:15px;
margin-bottom:12px;
}

.nome{
font-size:18px;
font-weight:bold;
}

.info{
color:#999;
margin-top:6px;
font-size:14px;
}

.acoes{
display:flex;
gap:10px;
margin-top:15px;
}

.editar{
flex:1;
padding:11px;
border:0;
border-radius:8px;
background:#3b82f6;
color:white;
font-weight:bold;
}

.excluir{
flex:1;
padding:11px;
border:0;
border-radius:8px;
background:#ff5555;
color:white;
font-weight:bold;
}

.tag{
display:inline-block;
margin-top:8px;
padding:4px 7px;
border-radius:5px;
background:#f2a900;
color:#000;
font-size:11px;
font-weight:bold;
}

</style></head><body><div class="container"><header><h1>⚡ VIBE KICKS</h1><a class="voltar" href="/">
← Loja
</a></header><button id="btnAdicionar" class="add">➕ ADICIONAR PRODUTO

</button><div id="formulario" class="form"><h2 id="titulo">
📦 Novo produto
</h2><label>Nome do tênis</label>

<input
id="nome"
type="text"
placeholder="Ex: Nike Air Max"

«»

<label>Preço</label>

<input
id="preco"
type="number"
step="0.01"
placeholder="299.90"

«»

<label>Preço antigo</label>

<input
id="precoAntigo"
type="number"
step="0.01"
placeholder="349.90"

«»

<label>Categoria</label>

<select id="categoria"><option value="masculino">
Masculino
</option><option value="feminino">
Feminino
</option></select><label>Etiqueta</label>

<select id="tag"><option value="">
Nenhuma
</option><option value="OFERTA">
OFERTA
</option><option value="NOVO">
NOVO
</option></select><label>URL da imagem</label>

<input
id="imagem"
type="url"
placeholder="https://..."

«»

<button
id="btnSalvar"
class="salvar"

«»

💾 SALVAR PRODUTO

</button><button
id="btnCancelar"
class="cancelar"

«»

CANCELAR

</button><div id="status" class="status"></div></div><div class="produtos"><h2>📋 Produtos cadastrados</h2><div id="lista">⏳ Carregando produtos...

</div></div></div><script>

const SUPABASE_URL =
'https://ravaircmbkotndfghilq.supabase.co';

const SUPABASE_KEY =
'sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C';


let editandoId = null;


/* ABRIR */

document
.getElementById('btnAdicionar')
.addEventListener('click', function(){

editandoId = null;

document
.getElementById('titulo')
.textContent =
'📦 Novo produto';

document
.getElementById('btnSalvar')
.textContent =
'💾 SALVAR PRODUTO';

limpar();

document
.getElementById('formulario')
.classList.add('aberto');

});


/* CANCELAR */

document
.getElementById('btnCancelar')
.addEventListener('click', function(){

document
.getElementById('formulario')
.classList.remove('aberto');

});


/* LIMPAR */

function limpar(){

document.getElementById('nome').value='';
document.getElementById('preco').value='';
document.getElementById('precoAntigo').value='';
document.getElementById('categoria').value='masculino';
document.getElementById('tag').value='';
document.getElementById('imagem').value='';

}


/* STATUS */

function status(texto,erro=false){

const elemento =
document.getElementById('status');

elemento.innerHTML=texto;

elemento.classList.add('mostrar');

if(erro){

elemento.style.background='#351515';

elemento.style.color='#ff7777';

}else{

elemento.style.background='#15351f';

elemento.style.color='#7cff9b';

}

}


/* SALVAR */

document
.getElementById('btnSalvar')
.addEventListener('click', salvar);


async function salvar(){

const nome =
document.getElementById('nome')
.value.trim();

const preco =
document.getElementById('preco')
.value;

const precoAntigo =
document.getElementById('precoAntigo')
.value;

const categoria =
document.getElementById('categoria')
.value;

const tag =
document.getElementById('tag')
.value;

const imagem =
document.getElementById('imagem')
.value.trim();


if(!nome){

status(
'❌ Digite o nome do tênis.',
true
);

return;

}


if(!preco){

status(
'❌ Digite o preço.',
true
);

return;

}


const dados = {

name:nome,

price:Number(preco),

old:
precoAntigo
? Number(precoAntigo)
: null,

cat:categoria,

tag:tag,

image:imagem

};


const botao =
document.getElementById('btnSalvar');

botao.disabled=true;

botao.textContent='⏳ SALVANDO...';


try{

let resposta;


if(editandoId){

resposta =
await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
editandoId,

{

method:'PATCH',

headers:{

'apikey':SUPABASE_KEY,

'Content-Type':
'application/json',

'Prefer':
'return=representation'

},

body:
JSON.stringify(dados)

}

);

}else{

resposta =
await fetch(

SUPABASE_URL +
'/rest/v1/products',

{

method:'POST',

headers:{

'apikey':SUPABASE_KEY,

'Content-Type':
'application/json',

'Prefer':
'return=representation'

},

body:
JSON.stringify(dados)

}

);


}


if(!resposta.ok){

const erro =
await resposta.text();

throw new Error(erro);

}


status(
editandoId
? '✅ Produto atualizado com sucesso!'
: '✅ Produto cadastrado com sucesso!'
);


limpar();

editandoId=null;

document
.getElementById('titulo')
.textContent='📦 Novo produto';

document
.getElementById('btnSalvar')
.textContent='💾 SALVAR PRODUTO';


carregar();


}catch(erro){

console.error(erro);

status(
'❌ Erro: ' +
erro.message,
true
);

}


botao.disabled=false;

if(!editandoId){

botao.textContent=
'💾 SALVAR PRODUTO';

}

}


/* CARREGAR */

async function carregar(){

const lista =
document.getElementById('lista');

lista.innerHTML=
'⏳ Carregando produtos...';


try{

const resposta =
await fetch(

SUPABASE_URL +
'/rest/v1/products?select=*&order=id.asc',

{

headers:{

'apikey':SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


const produtos =
await resposta.json();


if(!produtos.length){

lista.innerHTML=
'Nenhum produto cadastrado.';

return;

}


lista.innerHTML =
produtos.map(function(p){

const nome =
p.name ||
p.Name ||
'Produto';

const preco =
Number(p.price||0)
.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);

return `

<div class="produto">

<div class="nome">
${esc(nome)}
</div>

<div class="info">
💰 ${preco}
</div>

<div class="info">
📂 ${esc(p.cat||'Sem categoria')}
</div>

${p.tag ? `

<span class="tag">
${esc(p.tag)}
</span>

` : ''}

<div class="acoes">

<button
class="editar"
data-id="${p.id}"
>
✏️ EDITAR
</button>

<button
class="excluir"
data-id="${p.id}"
>
🗑️ EXCLUIR
</button>

</div>

</div>

`;

}).join('');


document
.querySelectorAll('.editar')
.forEach(function(botao){

botao.addEventListener(
'click',
function(){

editar(
Number(this.dataset.id)
);

});

});


document
.querySelectorAll('.excluir')
.forEach(function(botao){

botao.addEventListener(
'click',
function(){

excluir(
Number(this.dataset.id)
);

});

});


}catch(erro){

console.error(erro);

lista.innerHTML=
'<span style="color:#ff7777">' +
'❌ Erro ao carregar produtos.<br><br>' +
esc(erro.message) +
'</span>';

}

}


/* EDITAR */

async function editar(id){

try{

const resposta =
await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
id +
'&select=*',

{

headers:{

'apikey':SUPABASE_KEY

}

}

);


const produtos =
await resposta.json();


if(!produtos.length){

alert(
'Produto não encontrado.'
);

return;

}


const p=produtos[0];

editandoId=id;


document.getElementById('nome').value =
p.name || p.Name || '';

document.getElementById('preco').value =
p.price || '';

document.getElementById('precoAntigo').value =
p.old || '';

document.getElementById('categoria').value =
p.cat || 'masculino';

document.getElementById('tag').value =
p.tag || '';

document.getElementById('imagem').value =
p.image || '';


document.getElementById('titulo')
.textContent='✏️ Editar produto';

document.getElementById('btnSalvar')
.textContent='💾 ATUALIZAR PRODUTO';


document.getElementById('formulario')
.classList.add('aberto');


window.scrollTo({
top:0,
behavior:'smooth'
});


}catch(erro){

alert(
'❌ Erro ao editar:\n\n' +
erro.message
);

}

}


/* EXCLUIR */

async function excluir(id){

const confirmar =
confirm(
'⚠️ Tem certeza que deseja excluir este produto?'
);


if(!confirmar){

return;

}


try{

const resposta =
await fetch(

SUPABASE_URL +
'/rest/v1/products?id=eq.' +
id,

{

method:'DELETE',

headers:{

'apikey':SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


alert(
'✅ Produto excluído!'
);


carregar();


}catch(erro){

alert(
'❌ Erro ao excluir:\n\n' +
erro.message
);

}

}


/* ESCAPAR */

function esc(valor){

return String(valor ?? '')

.replace(/&/g,'&amp;')

.replace(/</g,'&lt;')

.replace(/>/g,'&gt;')

.replace(/"/g,'&quot;')

.replace(/'/g,'&#039;');

}


/* INICIAR */

carregar();

</script></body></html>
