<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel Vibe Kicks</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#090909;
color:#fff;
font-family:Arial,sans-serif;
}

.container{
max-width:700px;
margin:auto;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

h1{
margin:0;
font-size:25px;
}

.voltar{
color:#f2a900;
font-weight:bold;
text-decoration:none;
}

button{
cursor:pointer;
}

#abrir{
width:100%;
padding:17px;
border:0;
border-radius:10px;
background:#f2a900;
color:#000;
font-size:17px;
font-weight:bold;
}

#formulario{
display:none;
background:#151515;
padding:20px;
margin-top:20px;
border-radius:12px;
border:1px solid #333;
}

#formulario.aberto{
display:block;
}

h2{
margin-top:0;
}

label{
display:block;
margin-top:16px;
margin-bottom:7px;
font-weight:bold;
}

input,
select{
width:100%;
padding:14px;
background:#222;
border:1px solid #555;
border-radius:8px;
color:#fff;
font-size:16px;
}

#salvar{
display:block;
width:100%;
margin-top:25px;
padding:17px;
border:0;
border-radius:10px;
background:#25d366;
color:#000;
font-size:17px;
font-weight:900;
}

#salvar:disabled{
opacity:.6;
}

#cancelar{
display:block;
width:100%;
margin-top:10px;
padding:14px;
border:0;
border-radius:10px;
background:#333;
color:#fff;
font-weight:bold;
}

#mensagem{
display:none;
margin-top:15px;
padding:14px;
border-radius:8px;
line-height:1.5;
}

#lista{
margin-top:20px;
}

.produto{
background:#151515;
border:1px solid #333;
border-radius:12px;
padding:16px;
margin-bottom:12px;
}

.nome{
font-size:19px;
font-weight:bold;
}

.info{
color:#aaa;
margin-top:7px;
}

.acoes{
display:flex;
gap:10px;
margin-top:15px;
}

.editar,
.excluir{
width:50%;
padding:12px;
border:0;
border-radius:8px;
font-weight:bold;
}

.editar{
background:#287be5;
color:#fff;
}

.excluir{
background:#e53935;
color:#fff;
}

.tag{
display:inline-block;
margin-top:8px;
padding:5px 8px;
border-radius:5px;
background:#f2a900;
color:#000;
font-size:11px;
font-weight:bold;
}

.aviso{
background:#15351f;
color:#7cff9b;
padding:10px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

</style></head><body><div class="container"><div class="aviso">
✅ PAINEL VIBE KICKS ONLINE
</div><header><h1>⚡ VIBE KICKS</h1><a class="voltar" href="/">
← Loja
</a></header><button id="abrir">
➕ ADICIONAR PRODUTO
</button><div id="formulario"><h2 id="titulo">
📦 Novo produto
</h2><label for="nome">
Nome do tênis
</label><input
id="nome"
type="text"
placeholder="Ex: Nike Air Max"

«»

<label for="preco">
Preço
</label><input
id="preco"
type="number"
step="0.01"
placeholder="299.90"

«»

<label for="precoAntigo">
Preço antigo
</label><input
id="precoAntigo"
type="number"
step="0.01"
placeholder="349.90"

«»

<label for="categoria">
Categoria
</label><select id="categoria"><option value="masculino">
Masculino
</option><option value="feminino">
Feminino
</option></select><label for="tag">
Etiqueta
</label><select id="tag"><option value="">
Nenhuma
</option><option value="OFERTA">
OFERTA
</option><option value="NOVO">
NOVO
</option></select><label for="imagem">
URL da imagem
</label><input
id="imagem"
type="url"
placeholder="https://..."

«»

<button id="salvar">
💾 SALVAR PRODUTO
</button><button id="cancelar">
❌ CANCELAR
</button><div id="mensagem"></div></div><h2>
📋 Produtos cadastrados
</h2><div id="lista">
⏳ Carregando...
</div></div><script>

const URL_SUPABASE =
"https://ravaircmbkotndfghilq.supabase.co";

const CHAVE =
"sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

let editandoId=null;


/* ABRIR FORMULÁRIO */

document
.getElementById("abrir")
.addEventListener("click",function(){

document
.getElementById("formulario")
.classList.add("aberto");

window.scrollTo({
top:0,
behavior:"smooth"
});

});


/* CANCELAR */

document
.getElementById("cancelar")
.addEventListener("click",function(){

document
.getElementById("formulario")
.classList.remove("aberto");

editandoId=null;

});


/* SALVAR */

document
.getElementById("salvar")
.addEventListener("click",async function(){

const nome=
document.getElementById("nome")
.value.trim();

const preco=
document.getElementById("preco")
.value;

const precoAntigo=
document.getElementById("precoAntigo")
.value;

const categoria=
document.getElementById("categoria")
.value;

const tag=
document.getElementById("tag")
.value;

const imagem=
document.getElementById("imagem")
.value.trim();


if(!nome){

mostrar(
"❌ Digite o nome do tênis.",
true
);

return;

}


if(!preco){

mostrar(
"❌ Digite o preço.",
true
);

return;

}


const dados={

name:nome,

price:Number(preco),

old:
precoAntigo
?
Number(precoAntigo)
:
null,

cat:categoria,

tag:tag,

image:imagem

};


this.disabled=true;

this.textContent="⏳ SALVANDO...";


try{

let resposta;


if(editandoId){

resposta=
await fetch(

URL_SUPABASE+
"/rest/v1/products?id=eq."+
editandoId,

{

method:"PATCH",

headers:{

"apikey":CHAVE,

"Content-Type":
"application/json"

},

body:
JSON.stringify(dados)

}

);

}else{

resposta=
await fetch(

URL_SUPABASE+
"/rest/v1/products",

{

method:"POST",

headers:{

"apikey":CHAVE,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(dados)

}

);

}


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


mostrar(

editandoId
?
"✅ Produto atualizado com sucesso!"
:
"✅ Produto salvo com sucesso!"

);


limpar();

editandoId=null;

carregar();


}catch(erro){

console.error(erro);

mostrar(
"❌ Erro ao salvar:<br><br>"+
esc(erro.message),
true
);

}


this.disabled=false;

this.textContent=
"💾 SALVAR PRODUTO";

});


/* MENSAGEM */

function mostrar(texto,erro){

const m=
document.getElementById("mensagem");

m.innerHTML=texto;

m.style.display="block";

m.style.background=
erro
?
"#351515"
:
"#15351f";

m.style.color=
erro
?
"#ff7777"
:
"#7cff9b";

}


/* LIMPAR */

function limpar(){

document.getElementById("nome").value="";

document.getElementById("preco").value="";

document.getElementById("precoAntigo").value="";

document.getElementById("categoria").value="masculino";

document.getElementById("tag").value="";

document.getElementById("imagem").value="";

}


/* CARREGAR */

async function carregar(){

const lista=
document.getElementById("lista");

try{

const resposta=
await fetch(

URL_SUPABASE+
"/rest/v1/products?select=*&order=id.asc",

{

headers:{
"apikey":CHAVE
}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


const produtos=
await resposta.json();


if(!produtos.length){

lista.innerHTML=
"📦 Nenhum produto cadastrado.";

return;

}


lista.innerHTML=
produtos.map(function(p){

const nome=
p.name ||
p.Name ||
"Produto";

const preco=
Number(p.price||0)
.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

return `

<div class="produto">

<div class="nome">
${esc(nome)}
</div>

<div class="info">
💰 ${preco}
</div>

<div class="info">
📂 ${esc(p.cat||"Sem categoria")}
</div>

${p.tag?`

<div class="tag">
${esc(p.tag)}
</div>

`:``}

<div class="acoes">

<button
class="editar"
data-id="${p.id}"
>
✏️ EDITAR
</button>

<button
class="excluir"
data-id="${p.id}"
>
🗑️ EXCLUIR
</button>

</div>

</div>

`;

}).join("");


document
.querySelectorAll(".editar")
.forEach(function(btn){

btn.addEventListener(
"click",
function(){

editar(
Number(this.dataset.id)
);

});

});


document
.querySelectorAll(".excluir")
.forEach(function(btn){

btn.addEventListener(
"click",
function(){

excluir(
Number(this.dataset.id)
);

});

});


}catch(erro){

lista.innerHTML=
"❌ Erro: "+
esc(erro.message);

}

}


/* EDITAR */

async function editar(id){

try{

const resposta=
await fetch(

URL_SUPABASE+
"/rest/v1/products?id=eq."+
id,

{

headers:{
"apikey":CHAVE
}

}

);

const produtos=
await resposta.json();

if(!produtos.length){

alert("Produto não encontrado.");

return;

}

const p=produtos[0];

editandoId=id;

document.getElementById("nome").value=
p.name||p.Name||"";

document.getElementById("preco").value=
p.price||"";

document.getElementById("precoAntigo").value=
p.old||"";

document.getElementById("categoria").value=
p.cat||"masculino";

document.getElementById("tag").value=
p.tag||"";

document.getElementById("imagem").value=
p.image||"";

document.getElementById("titulo").textContent=
"✏️ Editar produto";

document.getElementById("salvar").textContent=
"💾 ATUALIZAR PRODUTO";

document.getElementById("formulario")
.classList.add("aberto");

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch(erro){

alert(
"Erro ao editar:\n\n"+
erro.message
);

}

}


/* EXCLUIR */

async function excluir(id){

if(!confirm(
"Tem certeza que deseja excluir este produto?"
)){

return;

}

try{

const resposta=
await fetch(

URL_SUPABASE+
"/rest/v1/products?id=eq."+
id,

{

method:"DELETE",

headers:{
"apikey":CHAVE
}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


alert(
"✅ Produto excluído!"
);

carregar();


}catch(erro){

alert(
"❌ Erro ao excluir:\n\n"+
erro.message
);

}

}


/* ESCAPAR */

function esc(valor){

return String(valor??"")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INICIAR */

carregar();

</script></body>
</html>
