<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE KICKS - Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #181818;
    border-bottom: 2px solid #f5a400;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.logo {
    color: #f5a400;
    font-size: 22px;
    font-weight: bold;
}

.usuario {
    color: #aaa;
    font-size: 12px;
    margin-top: 4px;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-buttons button {
    border: 0;
    padding: 10px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.loja {
    background: #f5a400;
    color: #111;
}

.sair {
    background: #333;
    color: white;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.box {
    background: #1b1b1b;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
    color: #f5a400;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 7px;
    border: 1px solid #444;
    background: #252525;
    color: white;
    font-size: 16px;
}

input[type="file"] {
    padding: 10px;
}

.main-button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: 0;
    border-radius: 8px;
    background: #f5a400;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.main-button:disabled {
    opacity: .6;
}

.cancel-button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 8px;
    background: #444;
    color: white;
    font-weight: bold;
}

#mensagem {
    display: none;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    word-break: break-word;
}

.preview {
    display: none;
    margin-top: 12px;
}

.preview img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

.produto {
    background: #242424;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    gap: 15px;
}

.produto img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    background: #333;
}

.produto-info {
    flex: 1;
}

.produto-info h3 {
    margin: 0 0 7px;
}

.produto-info p {
    margin: 5px 0;
    color: #ccc;
}

.acoes {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.acoes button {
    border: 0;
    padding: 9px 12px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.editar {
    background: #f5a400;
    color: #111;
}

.excluir {
    background: #d32f2f;
    color: white;
}

.carregando {
    color: #aaa;
    padding: 10px 0;
}

.erro-lista {
    background: #4b1d1d;
    padding: 12px;
    border-radius: 8px;
}

@media(max-width:600px) {

    header {
        align-items: flex-start;
    }

    .header-buttons {
        flex-direction: column;
    }

    .header-buttons button {
        width: 100%;
    }

    .produto {
        align-items: flex-start;
    }

    .produto img {
        width: 80px;
        height: 80px;
    }

    .acoes {
        flex-direction: column;
    }

    .acoes button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>

    <div>
        <div class="logo">VIBE KICKS</div>
        <div class="usuario" id="usuario"></div>
    </div>

    <div class="header-buttons">

        <button
            type="button"
            class="loja"
            onclick="irParaLoja()"
        >
            ← LOJA
        </button>

        <button
            type="button"
            class="sair"
            onclick="sair()"
        >
            🚪 SAIR
        </button>

    </div>

</header>


<div class="container">

    <div class="box">

        <h2 id="tituloFormulario">
            Adicionar produto
        </h2>

        <form id="produtoForm">

            <label for="nome">
                Nome do produto
            </label>

            <input
                id="nome"
                type="text"
                placeholder="Ex: Nike Air Max"
                required
            >


            <label for="preco">
                Preço
            </label>

            <input
                id="preco"
                type="number"
                step="0.01"
                placeholder="Ex: 299.90"
                required
            >


            <label for="categoria">
                Categoria
            </label>

            <input
                id="categoria"
                type="text"
                placeholder="Ex: Nike"
            >


            <label for="precoAntigo">
                Preço antigo
            </label>

            <input
                id="precoAntigo"
                type="number"
                step="0.01"
                placeholder="Ex: 399.90"
            >


            <label for="tag">
                Tag
            </label>

            <input
                id="tag"
                type="text"
                placeholder="Ex: PROMOÇÃO"
            >


            <label for="foto">
                Foto do produto
            </label>

            <input
                id="foto"
                type="file"
                accept="image/*"
            >


            <div
                class="preview"
                id="preview"
            >
                <img
                    id="previewImg"
                    alt="Prévia"
                >
            </div>


            <button
                type="submit"
                class="main-button"
                id="salvarBtn"
            >
                SALVAR PRODUTO
            </button>


            <button
                type="button"
                class="cancel-button"
                id="cancelarBtn"
                onclick="cancelarEdicao()"
                style="display:none;"
            >
                CANCELAR EDIÇÃO
            </button>

        </form>


        <div id="mensagem"></div>

    </div>


    <div class="box">

        <h2>
            Produtos cadastrados
        </h2>

        <div id="listaProdutos">
            <div class="carregando">
                Carregando produtos...
            </div>
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://ravaircmbkotndfghilq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

const BUCKET =
"produtos";


let accessToken =
localStorage.getItem("vibe_access_token");

let produtoEditando = null;

let imagemAtual = "";


/* ============================
   VERIFICAR LOGIN
============================ */

async function verificarLogin() {

    if (!accessToken) {

        window.location.replace(
            "login.html"
        );

        return false;
    }


    try {

        const resposta =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    method: "GET",
                    headers: {
                        "apikey":
                            SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            accessToken
                    }
                }
            );


        if (!resposta.ok) {

            localStorage.removeItem(
                "vibe_access_token"
            );

            localStorage.removeItem(
                "vibe_refresh_token"
            );

            localStorage.removeItem(
                "vibe_user_email"
            );

            window.location.replace(
                "login.html"
            );

            return false;
        }


        const usuario =
            await resposta.json();


        document.getElementById(
            "usuario"
        ).textContent =
            usuario.email || "";


        return true;


    } catch (erro) {

        console.error(erro);

        window.location.replace(
            "login.html"
        );

        return false;
    }
}



/* ============================
   MENSAGEM
============================ */

function mostrarMensagem(
    texto,
    erro = false
) {

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.style.display =
        "block";

    elemento.textContent =
        texto;


    if (erro) {

        elemento.style.background =
            "#5b1b1b";

    } else {

        elemento.style.background =
            "#234d23";
    }
}



/* ============================
   PREVIEW FOTO
============================ */

document
.getElementById("foto")
.addEventListener(
    "change",
    function() {

        const arquivo =
            this.files[0];


        if (!arquivo) {

            document.getElementById(
                "preview"
            ).style.display =
                "none";

            return;
        }


        const leitor =
            new FileReader();


        leitor.onload =
            function(evento) {

                document.getElementById(
                    "previewImg"
                ).src =
                    evento.target.result;

                document.getElementById(
                    "preview"
                ).style.display =
                    "block";
            };


        leitor.readAsDataURL(
            arquivo
        );
    }
);



/* ============================
   ENVIAR FOTO
============================ */

async function enviarFoto() {

    const input =
        document.getElementById(
            "foto"
        );


    const arquivo =
        input.files[0];


    if (!arquivo) {

        return imagemAtual || "";
    }


    if (
        !arquivo.type.startsWith(
            "image/"
        )
    ) {

        throw new Error(
            "Escolha uma imagem válida."
        );
    }


    if (
        arquivo.size >
        6 * 1024 * 1024
    ) {

        throw new Error(
            "A foto deve ter no máximo 6 MB."
        );
    }


    const nomeOriginal =
        arquivo.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "-"
        );


    const nomeArquivo =
        Date.now() +
        "-" +
        nomeOriginal;


    const resposta =
        await fetch(

            SUPABASE_URL +
            "/storage/v1/object/" +
            BUCKET +
            "/" +
            nomeArquivo,

            {
                method: "POST",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        arquivo.type,

                    "x-upsert":
                        "true"
                },

                body:
                    arquivo
            }
        );


    if (!resposta.ok) {

        const erro =
            await resposta.text();

        console.error(
            "Erro no upload:",
            erro
        );

        throw new Error(
            "Erro ao enviar foto: " +
            erro
        );
    }


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUCKET +
        "/" +
        nomeArquivo
    );
}



/* ============================
   SALVAR PRODUTO
============================ */

async function salvarProduto(
    evento
) {

    evento.preventDefault();


    const botao =
        document.getElementById(
            "salvarBtn"
        );


    try {

        botao.disabled = true;

        botao.textContent =
            "⏳ SALVANDO...";


        const nome =
            document.getElementById(
                "nome"
            ).value.trim();


        const preco =
            document.getElementById(
                "preco"
            ).value;


        const categoria =
            document.getElementById(
                "categoria"
            ).value.trim();


        const precoAntigo =
            document.getElementById(
                "precoAntigo"
            ).value;


        const tag =
            document.getElementById(
                "tag"
            ).value.trim();


        if (!nome) {

            throw new Error(
                "Digite o nome do produto."
            );
        }


        if (!preco) {

            throw new Error(
                "Digite o preço."
            );
        }


        mostrarMensagem(
            "⏳ Salvando produto..."
        );


        const imagem =
            await enviarFoto();


        const produto = {

            name: nome,

            price:
                Number(preco),

            Cat:
                categoria,

            Old:
                precoAntigo === ""
                ? null
                : Number(precoAntigo),

            Tag:
                tag,

            image:
                imagem
        };


        let resposta;


        /* EDITAR */

        if (produtoEditando) {

            resposta =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/products?id=eq." +
                    produtoEditando,

                    {
                        method:
                            "PATCH",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify(
                                produto
                            )
                    }
                );

        }


        /* ADICIONAR */

        else {

            resposta =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/products",

                    {
                        method:
                            "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify(
                                produto
                            )
                    }
                );
        }


        if (!resposta.ok) {

            const erro =
                await resposta.text();

            console.error(
                erro
            );

            throw new Error(
                erro ||
                "Erro ao salvar produto."
            );
        }


        mostrarMensagem(
            produtoEditando
            ? "✅ Produto atualizado!"
            : "✅ Produto cadastrado!"
        );


        limparFormulario();


        /*
         * IMPORTANTE:
         * Atualiza a lista sem travar
         */

        await carregarProdutos();


    } catch (erro) {

        console.error(erro);

        mostrarMensagem(
            "❌ " +
            (
                erro.message ||
                "Erro ao salvar."
            ),
            true
        );


    } finally {

        botao.disabled =
            false;

        botao.textContent =
            produtoEditando
            ? "ATUALIZAR PRODUTO"
            : "SALVAR PRODUTO";
    }

}



/* ============================
   FORMULÁRIO
============================ */

document
.getElementById("produtoForm")
.addEventListener(
    "submit",
    salvarProduto
);



/* ============================
   CARREGAR PRODUTOS
============================ */

async function carregarProdutos() {

    const lista =
        document.getElementById(
            "listaProdutos"
        );


    lista.innerHTML =
        '<div class="carregando">⏳ Carregando produtos...</div>';


    try {

        const resposta =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/products?select=*&order=id.asc",

                {
                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        if (!resposta.ok) {

            const erro =
                await resposta.text();

            throw new Error(
                erro
            );
        }


        const produtos =
            await resposta.json();


        lista.innerHTML = "";


        if (
            !Array.isArray(produtos) ||
            produtos.length === 0
        ) {

            lista.innerHTML =
                "<p>Nenhum produto cadastrado.</p>";

            return;
        }


        produtos.forEach(
            function(produto) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "produto";


                const imagem =
                    produto.image ||
                    "";


                const preco =
                    Number(
                        produto.price || 0
                    ).toLocaleString(
                        "pt-BR",
                        {
                            style:
                                "currency",
                            currency:
                                "BRL"
                        }
                    );


                let precoAntigo =
                    "";


                if (
                    produto.Old !== null &&
                    produto.Old !== undefined &&
                    produto.Old !== ""
                ) {

                    precoAntigo =
                        Number(
                            produto.Old
                        ).toLocaleString(
                            "pt-BR",
                            {
                                style:
                                    "currency",
                                currency:
                                    "BRL"
                            }
                        );
                }


                div.innerHTML = `

                    <img
                        src="${escaparHTML(imagem)}"
                        alt=""
                        onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27100%27 height=%27100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%23333%27/%3E%3C/svg%3E'"
                    >

                    <div class="produto-info">

                        <h3>
                            ${escaparHTML(
                                produto.name || ""
                            )}
                        </h3>

                        <p>
                            ${escaparHTML(
                                produto.Cat || ""
                            )}
                        </p>

                        <p>
                            <strong>
                                ${preco}
