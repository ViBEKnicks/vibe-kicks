<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Vibe Kicks</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:#fff;
}

header{
background:#181818;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #333;
}

.logo{
font-size:25px;
font-weight:bold;
color:#ffb000;
}

.voltar{
color:#fff;
text-decoration:none;
background:#333;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.status{
background:#153d1e;
color:#5cff78;
padding:15px;
border-radius:10px;
margin-bottom:20px;
text-align:center;
font-weight:bold;
}

.botao-adicionar{
width:100%;
padding:16px;
border:0;
border-radius:10px;
background:#ffb000;
color:#111;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-bottom:20px;
}

.formulario{
display:none;
background:#1b1b1b;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

.formulario.aberto{
display:block;
}

h2{
margin-top:0;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input,select{
width:100%;
padding:13px;
border-radius:8px;
border:1px solid #444;
background:#252525;
color:#fff;
font-size:16px;
}

.botoes{
display:flex;
gap:10px;
margin-top:20px;
}

.salvar{
flex:1;
padding:15px;
background:#22c55e;
border:0;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.cancelar{
padding:15px;
background:#555;
color:#fff;
border:0;
border-radius:8px;
cursor:pointer;
}

.mensagem{
margin-top:15px;
padding:12px;
border-radius:8px;
display:none;
}

.produto{
background:#1b1b1b;
padding:15px;
border-radius:12px;
margin-bottom:15px;
display:flex;
gap:15px;
align-items:center;
}

.produto img{
width:100px;
height:100px;
object-fit:contain;
background:#fff;
border-radius:8px;
}

.info{
flex:1;
}

.nome-produto{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.preco{
color:#ffb000;
font-size:18px;
font-weight:bold;
}

.acoes{
display:flex;
gap:8px;
margin-top:10px;
}

.editar{
background:#2563eb;
color:#fff;
border:0;
padding:9px 12px;
border-radius:7px;
cursor:pointer;
}

.excluir{
background:#dc2626;
color:#fff;
border:0;
padding:9px 12px;
border-radius:7px;
cursor:pointer;
}

.vazio{
text-align:center;
padding:30px;
color:#aaa;
}

</style>
</head>

<body>

<header>

<div class="logo">
VIBE KICKS
</div>

<a class="voltar" href="index.html">
← Loja
</a>

</header>

<div class="container">

<div class="status" id="status">
✅ PAINEL VIBE KICKS ONLINE
</div>

<button class="botao-adicionar" id="abrir">
➕ ADICIONAR PRODUTO
</button>

<div class="formulario" id="formulario">

<h2 id="tituloFormulario">
Adicionar produto
</h2>

<label>
Nome do produto
</label>

<input
type="text"
id="nome"
placeholder="Ex: Nike Air Max"
>

<label>
Preço
</label>

<input
type="number"
id="preco"
placeholder="Ex: 399.90"
step="0.01"
>

<label>
Preço antigo
</label>

<input
type="number"
id="precoAntigo"
placeholder="Ex: 499.90"
step="0.01"
>

<label>
Categoria
</label>

<select id="categoria">

<option value="Tênis">
Tênis
</option>

<option value="Masculino">
Masculino
</option>

<option value="Feminino">
Feminino
</option>

<option value="Infantil">
Infantil
</option>

</select>

<label>
Etiqueta
</label>

<select id="tag">

<option value="">
Sem etiqueta
</option>

<option value="NOVO">
NOVO
</option>

<option value="OFERTA">
OFERTA
</option>

<option value="DESTAQUE">
DESTAQUE
</option>

</select>

<label>
URL da imagem
</label>

<input
type="text"
id="imagem"
placeholder="https://..."
>

<div class="botoes">

<button class="salvar" id="salvar">
💾 SALVAR PRODUTO
</button>

<button class="cancelar" id="cancelar">
CANCELAR
</button>

</div>

<div class="mensagem" id="mensagem"></div>

</div>

<h2>
📦 Produtos cadastrados
</h2>

<div id="lista">
Carregando produtos...
</div>

</div>

<script>

var SUPABASE_URL =
"https://ravaircmbkotndfghilq.supabase.co";

var SUPABASE_KEY =
"sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

var editandoId = null;


/* =========================
   ELEMENTOS
========================= */

var abrir =
document.getElementById("abrir");

var formulario =
document.getElementById("formulario");

var cancelar =
document.getElementById("cancelar");

var salvar =
document.getElementById("salvar");

var lista =
document.getElementById("lista");

var mensagem =
document.getElementById("mensagem");

var tituloFormulario =
document.getElementById("tituloFormulario");


/* =========================
   ABRIR FORMULÁRIO
========================= */

abrir.onclick = function(){

editandoId = null;

tituloFormulario.innerText =
"Adicionar produto";

limparFormulario();

formulario.classList.add("aberto");

window.scrollTo(0,0);

};


/* =========================
   CANCELAR
========================= */

cancelar.onclick = function(){

formulario.classList.remove("aberto");

editandoId = null;

limparFormulario();

};


/* =========================
   LIMPAR
========================= */

function limparFormulario(){

document.getElementById("nome").value = "";

document.getElementById("preco").value = "";

document.getElementById("precoAntigo").value = "";

document.getElementById("categoria").value = "Tênis";

document.getElementById("tag").value = "";

document.getElementById("imagem").value = "";

}


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(texto, sucesso){

mensagem.style.display = "block";

mensagem.innerText = texto;

if(sucesso){

mensagem.style.background = "#153d1e";

mensagem.style.color = "#5cff78";

}else{

mensagem.style.background = "#451515";

mensagem.style.color = "#ff7777";

}

}


/* =========================
   SALVAR
========================= */

salvar.onclick = async function(){

var nome =
document.getElementById("nome").value.trim();

var preco =
document.getElementById("preco").value;

var precoAntigo =
document.getElementById("precoAntigo").value;

var categoria =
document.getElementById("categoria").value;

var tag =
document.getElementById("tag").value;

var imagem =
document.getElementById("imagem").value.trim();


if(nome === ""){

mostrarMensagem(
"Digite o nome do produto.",
false
);

return;

}


if(preco === ""){

mostrarMensagem(
"Digite o preço do produto.",
false
);

return;

}


if(imagem === ""){

mostrarMensagem(
"Digite a URL da imagem.",
false
);

return;

}


var produto = {

name: nome,

price: Number(preco),

old: precoAntigo === ""
? null
: Number(precoAntigo),

cat: categoria,

tag: tag,

image: imagem

};


salvar.disabled = true;

salvar.innerText = "SALVANDO...";


try{

var resposta;


if(editandoId === null){

/* NOVO PRODUTO */

resposta = await fetch(

SUPABASE_URL +
"/rest/v1/products",

{

method:"POST",

headers:{

"apikey":SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify(produto)

}

);

}else{

/* EDITAR PRODUTO */

resposta = await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
editandoId,

{

method:"PATCH",

headers:{

"apikey":SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify(produto)

}

);

}


var texto =
await resposta.text();


if(!resposta.ok){

throw new Error(texto);

}


mostrarMensagem(

editandoId === null
? "✅ Produto adicionado com sucesso!"
: "✅ Produto atualizado com sucesso!",

true

);


formulario.classList.remove("aberto");

editandoId = null;

limparFormulario();

await carregarProdutos();


}catch(erro){

console.error(erro);

mostrarMensagem(

"❌ Erro ao salvar: " +
erro.message,

false

);

}


salvar.disabled = false;

salvar.innerText =
"💾 SALVAR PRODUTO";

};


/* =========================
   CARREGAR PRODUTOS
========================= */

async function carregarProdutos(){

lista.innerHTML =
"Carregando produtos...";


try{

var resposta = await fetch(

SUPABASE_URL +
"/rest/v1/products?select=*&order=id.asc",

{

method:"GET",

headers:{

"apikey":SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


var produtos =
await resposta.json();


lista.innerHTML = "";


if(produtos.length === 0){

lista.innerHTML =
'<div class="vazio">Nenhum produto cadastrado.</div>';

return;

}


for(var i = 0; i < produtos.length; i++){

criarProduto(produtos[i]);

}


}catch(erro){

console.error(erro);

lista.innerHTML =

'<div class="vazio">' +
"❌ Erro ao carregar produtos." +
"<br><br>" +
erro.message +
"</div>";

}

}


/* =========================
   CRIAR CARD
========================= */

function criarProduto(produto){

var card =
document.createElement("div");

card.className =
"produto";


var imagem =
document.createElement("img");

imagem.src =
produto.image || "";

imagem.onerror =
function(){

this.style.display = "none";

};


var info =
document.createElement("div");

info.className =
"info";


var nome =
document.createElement("div");

nome.className =
"nome-produto";

nome.innerText =
produto.name || "Sem nome";


var preco =
document.createElement("div");

preco.className =
"preco";

preco.innerText =
formatarPreco(produto.price);


var categoria =
document.createElement("div");

categoria.innerText =
"Categoria: " +
(produto.cat || "-");


var acoes =
document.createElement("div");

acoes.className =
"acoes";


var editar =
document.createElement("button");

editar.className =
"editar";

editar.innerText =
"✏️ EDITAR";


editar.onclick =
function(){

editarProduto(produto);

};


var excluir =
document.createElement("button");

excluir.className =
"excluir";

excluir.innerText =
"🗑️ EXCLUIR";


excluir.onclick =
function(){

excluirProduto(produto.id);

};


acoes.appendChild(editar);

acoes.appendChild(excluir);


info.appendChild(nome);

info.appendChild(preco);

info.appendChild(categoria);

info.appendChild(acoes);


card.appendChild(imagem);

card.appendChild(info);


lista.appendChild(card);

}


/* =========================
   EDITAR
========================= */

function editarProduto(produto){

editandoId =
produto.id;

tituloFormulario.innerText =
"Editar produto";


document.getElementById("nome").value =
produto.name || "";


document.getElementById("preco").value =
produto.price || "";


document.getElementById("precoAntigo").value =
produto.old || "";


document.getElementById("categoria").value =
produto.cat || "Tênis";


document.getElementById("tag").value =
produto.tag || "";


document.getElementById("imagem").value =
produto.image || "";


formulario.classList.add("aberto");

window.scrollTo(0,0);

}


/* =========================
   EXCLUIR
========================= */

async function excluirProduto(id){

var confirmar =
confirm(
"Tem certeza que deseja excluir este produto?"
);


if(!confirmar){

return;

}


try{

var resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
id,

{

method:"DELETE",

headers:{

"apikey":SUPABASE_KEY,

"Prefer":
"return=representation"

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


alert(
"✅ Produto excluído com sucesso!"
);


carregarProdutos();


}catch(erro){

console.error(erro);

alert(
"❌ Erro ao excluir: " +
erro.message
);

}

}


/* =========================
   PREÇO
========================= */

function formatarPreco(valor){

return Number(valor || 0)
.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


/* =========================
   TESTE DO JAVASCRIPT
========================= */

document.getElementById("status").innerText =
"✅ PAINEL VIBE KICKS ONLINE — JAVASCRIPT FUNCIONANDO";


/* =========================
   INICIAR
========================= */

carregarProdutos();

</script>

</body>
</html>
