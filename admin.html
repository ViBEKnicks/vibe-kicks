<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE KICKS - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #181818;
      padding: 18px;
      border-bottom: 2px solid #f5b400;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      color: #f5b400;
      font-size: 24px;
    }

    .top-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-loja {
      background: #f5b400;
      color: #111;
    }

    .btn-sair {
      background: #d62828;
      color: #fff;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .usuario {
      background: #1d1d1d;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      color: #ccc;
      word-break: break-word;
    }

    .box {
      background: #1b1b1b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #292929;
    }

    h2 {
      margin-top: 0;
      color: #f5b400;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #ddd;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 2px solid #f5b400;
    }

    .btn-salvar {
      width: 100%;
      margin-top: 20px;
      background: #f5b400;
      color: #111;
      font-size: 16px;
      padding: 15px;
    }

    .btn-cancelar {
      width: 100%;
      margin-top: 10px;
      background: #444;
      color: #fff;
    }

    #mensagem {
      display: none;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .sucesso {
      background: #14532d;
      color: #bbf7d0;
    }

    .erro {
      background: #7f1d1d;
      color: #fecaca;
    }

    .produto {
      background: #222;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .produto img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
    }

    .produto-info {
      flex: 1;
      min-width: 200px;
    }

    .produto-info h3 {
      margin: 0 0 8px;
      color: #fff;
    }

    .produto-info p {
      margin: 5px 0;
      color: #bbb;
    }

    .produto-botoes {
      display: flex;
      gap: 8px;
    }

    .btn-editar {
      background: #2563eb;
      color: #fff;
    }

    .btn-excluir {
      background: #dc2626;
      color: #fff;
    }

    #preview {
      display: none;
      max-width: 180px;
      max-height: 180px;
      margin-top: 12px;
      border-radius: 10px;
      object-fit: cover;
    }

    .carregando {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    .vazio {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    .erro-lista {
      background: #351313;
      border: 1px solid #8b2525;
      padding: 15px;
      border-radius: 10px;
      color: #ffb4b4;
      text-align: center;
    }

    .btn-tentar {
      margin-top: 12px;
      background: #f5b400;
      color: #111;
    }
  </style>
</head>

<body>

<header>
  <h1>👟 VIBE KICKS — ADMIN</h1>

  <div class="top-buttons">
    <button type="button" class="btn-loja" onclick="irParaLoja()">
      🏪 LOJA
    </button>

    <button type="button" class="btn-sair" onclick="sair()">
      🚪 SAIR
    </button>
  </div>
</header>

<main>

  <div class="usuario">
    🔐 Logado como: <strong id="usuarioEmail">verificando...</strong>
  </div>

  <div id="mensagem"></div>

  <div class="box">

    <h2 id="tituloFormulario">➕ Adicionar produto</h2>

    <form id="produtoForm">

      <label for="nome">Nome do produto</label>
      <input
        type="text"
        id="nome"
        placeholder="Ex: Nike Air Max"
        required
      >

      <label for="preco">Preço</label>
      <input
        type="number"
        id="preco"
        placeholder="Ex: 299.90"
        step="0.01"
        min="0"
        required
      >

      <label for="precoAntigo">Preço antigo</label>
      <input
        type="number"
        id="precoAntigo"
        placeholder="Ex: 399.90"
        step="0.01"
        min="0"
      >

      <label for="categoria">Categoria</label>
      <input
        type="text"
        id="categoria"
        placeholder="Ex: Masculino"
      >

      <label for="tag">Tag</label>
      <input
        type="text"
        id="tag"
        placeholder="Ex: PROMOÇÃO"
      >

      <label for="foto">Foto do produto</label>
      <input
        type="file"
        id="foto"
        accept="image/*"
      >

      <img id="preview" alt="Prévia da foto">

      <button type="submit" class="btn-salvar" id="btnSalvar">
        💾 SALVAR PRODUTO
      </button>

      <button
        type="button"
        class="btn-cancelar"
        id="btnCancelar"
        onclick="cancelarEdicao()"
        style="display:none;"
      >
        CANCELAR EDIÇÃO
      </button>

    </form>

  </div>


  <div class="box">

    <h2>📦 Produtos cadastrados</h2>

    <div id="listaProdutos">
      <div class="carregando">
        ⏳ Carregando produtos...
      </div>
    </div>

  </div>

</main>


<script>

  /* =========================
     CONFIGURAÇÃO SUPABASE
  ========================= */

  var SUPABASE_URL =
    "https://ravaircmbkotndfghilq.supabase.co";

  var SUPABASE_KEY =
    "sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

  var BUCKET = "produtos";


  /* =========================
     VARIÁVEIS
  ========================= */

  var accessToken =
    localStorage.getItem("vibe_access_token");

  var refreshToken =
    localStorage.getItem("vibe_refresh_token");

  var produtoEditando = null;

  var imagemAtual = "";


  /* =========================
     VERIFICAR LOGIN
  ========================= */

  async function verificarLogin() {

    if (!accessToken) {
      window.location.replace("login.html");
      return false;
    }

    try {

      var resposta = await fetch(
        SUPABASE_URL + "/auth/v1/user",
        {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + accessToken
          }
        }
      );

      if (!resposta.ok) {

        localStorage.removeItem("vibe_access_token");
        localStorage.removeItem("vibe_refresh_token");
        localStorage.removeItem("vibe_user_email");

        window.location.replace("login.html");

        return false;
      }

      var usuario = await resposta.json();

      document.getElementById("usuarioEmail").textContent =
        usuario.email || "Usuário autenticado";

      return true;

    } catch (erro) {

      mostrarMensagem(
        "Erro ao verificar login: " + erro.message,
        true
      );

      return false;
    }
  }


  /* =========================
     LOJA
  ========================= */

  function irParaLoja() {

    window.location.href =
      "https://vibe-kicks.vercel.app/";

  }


  /* =========================
     SAIR
  ========================= */

  function sair() {

    localStorage.removeItem("vibe_access_token");
    localStorage.removeItem("vibe_refresh_token");
    localStorage.removeItem("vibe_user_email");

    window.location.replace("login.html");

  }


  /* =========================
     MENSAGENS
  ========================= */

  function mostrarMensagem(texto, erro) {

    var elemento =
      document.getElementById("mensagem");

    elemento.style.display = "block";

    elemento.className =
      erro ? "erro" : "sucesso";

    elemento.textContent = texto;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function esconderMensagem() {

    var elemento =
      document.getElementById("mensagem");

    elemento.style.display = "none";

  }


  /* =========================
     ESCAPAR HTML
  ========================= */

  function escaparHTML(valor) {

    if (valor === null || valor === undefined) {
      return "";
    }

    return String(valor)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     CARREGAR PRODUTOS
  ========================= */

  async function carregarProdutos() {

    var lista =
      document.getElementById("listaProdutos");

    lista.innerHTML =
      '<div class="carregando">⏳ Carregando produtos...</div>';

    try {

      var controlador =
        new AbortController();

      var timeout =
        setTimeout(function() {
          controlador.abort();
        }, 10000);


      var resposta = await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.asc",
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + accessToken
          },

          signal: controlador.signal
        }
      );


      clearTimeout(timeout);


      if (!resposta.ok) {

        var textoErro =
          await resposta.text();

        throw new Error(
          "Erro " +
          resposta.status +
          ": " +
          textoErro
        );
      }


      var produtos =
        await resposta.json();


      if (!Array.isArray(produtos)) {

        throw new Error(
          "A resposta do Supabase não é uma lista de produtos."
        );

      }


      if (produtos.length === 0) {

        lista.innerHTML =
          '<div class="vazio">' +
          '📦 Nenhum produto cadastrado ainda.' +
          '</div>';

        return;
      }


      lista.innerHTML = "";


      produtos.forEach(function(produto) {

        var div =
          document.createElement("div");

        div.className = "produto";


        var imagem =
          produto.image ||
          "https://via.placeholder.com/300x300?text=Sem+foto";


        var preco =
          produto.price !== null &&
          produto.price !== undefined
            ? Number(produto.price).toFixed(2).replace(".", ",")
            : "0,00";


        var precoAntigo = "";

        if (
          produto.Old !== null &&
          produto.Old !== undefined &&
          produto.Old !== ""
        ) {

          precoAntigo =
            Number(produto.Old)
              .toFixed(2)
              .replace(".", ",");

        }


        div.innerHTML = `

          <img
            src="${escaparHTML(imagem)}"
            alt="${escaparHTML(produto.name)}"
            onerror="this.src='https://via.placeholder.com/300x300?text=Sem+foto'"
          >

          <div class="produto-info">

            <h3>
              ${escaparHTML(produto.name)}
            </h3>

            <p>
              💰 Preço:
              <strong>R$ ${preco}</strong>
            </p>

            ${
              precoAntigo
                ? `<p>🏷️ Preço antigo: R$ ${precoAntigo}</p>`
                : ""
            }

            <p>
              📂 Categoria:
              ${escaparHTML(produto.Cat || "-")}
            </p>

            <p>
              🔖 Tag:
              ${escaparHTML(produto.Tag || "-")}
            </p>

          </div>

          <div class="produto-botoes">

            <button
              type="button"
              class="btn-editar"
              onclick="editarProduto(${Number(produto.id)})"
            >
              ✏️ EDITAR
            </button>

            <button
              type="button"
              class="btn-excluir"
              onclick="excluirProduto(${Number(produto.id)})"
            >
              🗑️ EXCLUIR
            </button>

          </div>

        `;


        lista.appendChild(div);

      });


      window.produtosCarregados =
        produtos;


    } catch (erro) {

      console.error(erro);

      var mensagemErro =
        erro.name === "AbortError"
          ? "O carregamento demorou demais. Verifique sua internet ou o Supabase."
          : erro.message;


      lista.innerHTML = `

        <div class="erro-lista">

          ❌ Não foi possível carregar os produtos.

          <br><br>

          ${escaparHTML(mensagemErro)}

          <br>

          <button
            type="button"
            class="btn-tentar"
            onclick="carregarProdutos()"
          >
            🔄 TENTAR NOVAMENTE
          </button>

        </div>

      `;

    }

  }


  /* =========================
     PREVIEW DA FOTO
  ========================= */

  document
    .getElementById("foto")
    .addEventListener("change", function() {

      var arquivo =
        this.files[0];

      var preview =
        document.getElementById("preview");


      if (!arquivo) {

        preview.style.display = "none";
        preview.src = "";

        return;
      }


      if (!arquivo.type.startsWith("image/")) {

        mostrarMensagem(
          "Escolha uma imagem válida.",
          true
        );

        this.value = "";

        return;
      }


      var leitor =
        new FileReader();


      leitor.onload = function(e) {

        preview.src =
          e.target.result;

        preview.style.display =
          "block";

      };


      leitor.readAsDataURL(arquivo);

    });


  /* =========================
     ENVIAR FOTO
  ========================= */

  async function enviarFoto() {

    var input =
      document.getElementById("foto");

    var arquivo =
      input.files[0];


    if (!arquivo) {

      return imagemAtual || "";

    }


    if (!arquivo.type.startsWith("image/")) {

      throw new Error(
        "Escolha uma imagem válida."
      );

    }


    if (arquivo.size > 6 * 1024 * 1024) {

      throw new Error(
        "A foto deve ter no máximo 6 MB."
      );

    }


    var nomeOriginal =
      arquivo.name
        .replace(/[^a-zA-Z0-9._-]/g, "-");


    var nomeArquivo =
      Date.now() + "-" + nomeOriginal;


    var resposta =
      await fetch(
        SUPABASE_URL +
        "/storage/v1/object/" +
        BUCKET +
        "/" +
        nomeArquivo,
        {

          method: "POST",

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + accessToken,

            "Content-Type":
              arquivo.type,

            "x-upsert":
              "true"

          },

          body: arquivo

        }
      );


    if (!resposta.ok) {

      var erro =
        await resposta.text();

      throw new Error(
        "Erro ao enviar foto: " +
        erro
      );

    }


    return (
      SUPABASE_URL +
      "/storage/v1/object/public/" +
      BUCKET +
      "/" +
      nomeArquivo
    );

  }


  /* =========================
     SALVAR PRODUTO
  ========================= */

  async function salvarProduto(evento) {

    if (evento) {
      evento.preventDefault();
    }


    esconderMensagem();


    var btn =
      document.getElementById("btnSalvar");


    btn.disabled = true;

    btn.textContent =
      "⏳ SALVANDO...";


    try {

      var nome =
        document
          .getElementById("nome")
          .value
          .trim();


      var preco =
        document
          .getElementById("preco")
          .value;


      var precoAntigo =
        document
          .getElementById("precoAntigo")
          .value;


      var categoria =
        document
          .getElementById("categoria")
          .value
          .trim();


      var tag =
        document
          .getElementById("tag")
          .value
          .trim();


      if (!nome) {

        throw new Error(
          "Digite o nome do produto."
        );

      }


      if (!preco) {

        throw new Error(
          "Digite o preço do produto."
        );

      }


      var imagem =
        await enviarFoto();


      var produto = {

        name: nome,

        price: Number(preco),

        Cat: categoria,

        Old:
          precoAntigo === ""
            ? null
            : Number(precoAntigo),

        Tag: tag,

        image: imagem

      };


      var resposta;


      if (produtoEditando) {

        resposta =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/products?id=eq." +
            produtoEditando,
            {

              method: "PATCH",

              headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                  "Bearer " + accessToken,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"

              },

              body:
                JSON.stringify(produto)

            }
          );

      } else {

        resposta =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/products",
            {

              method: "POST",

              headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                  "Bearer " + accessToken,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"

              },

              body:
                JSON.stringify(produto)

            }
          );

      }


      if (!resposta.ok) {

        var erroTexto =
          await resposta.text();

        throw new Error(
          "Erro do Supabase: " +
          resposta.status +
          " - " +
          erroTexto
        );

      }


      mostrarMensagem(
        produtoEditando
          ? "✅ Produto atualizado com sucesso!"
          : "✅ Produto cadastrado com sucesso!",
        false
      );


      limparFormulario();


      /* 
         Não deixa a tela presa no "salvando".
         O produto é salvo primeiro e depois
         a lista é atualizada.
      */

      carregarProdutos();


    } catch (erro) {

      console.error(erro);

      mostrarMensagem(
        "❌ " + erro.message,
        true
      );

    } finally {

      btn.disabled = false;

      btn.textContent =
        "💾 SALVAR PRODUTO";

    }

  }


  /* =========================
     EDITAR PRODUTO
  ========================= */

  function editarProduto(id) {

    var produtos =
      window.produtosCarregados || [];


    var produto =
      produtos.find(function(item) {

        return Number(item.id) === Number(id);

      });


    if (!produto) {

      mostrarMensagem(
        "Produto não encontrado.",
        true
      );

      return;

    }


    produtoEditando =
      produto.id;


    document.getElementById("nome").value =
      produto.name || "";


    document.getElementById("preco").value =
      produto.price || "";


    document.getElementById("precoAntigo").value =
      produto.Old || "";


    document.getElementById("categoria").value =
      produto.Cat || "";


    document.getElementById("tag").value =
      produto.Tag || "";


    imagemAtual =
      produto.image || "";


    document.getElementById(
      "tituloFormulario"
    ).textContent =
      "✏️ Editando produto";


    document.getElementById(
      "btnSalvar"
    ).textContent =
      "💾 ATUALIZAR PRODUTO";


    document.getElementById(
      "btnCancelar"
    ).style.display =
      "block";


    var preview =
      doc
