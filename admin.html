<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE KICKS — Painel Admin</title>
<style>
:root{--bg:#090909;--card:#121212;--text:#f5f5f5;--muted:#999;--accent:#f2a900;--line:#292929;--danger:#e74c3c;--ok:#25d366}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
.logo{font-size:26px;font-weight:900}.logo span{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
h1,h2,h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;color:#bbb;font-size:13px;font-weight:700;margin-bottom:6px}
input,select{width:100%;background:#0d0d0d;border:1px solid #3a3a3a;color:#fff;border-radius:8px;padding:12px}
input:focus,select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#000}.secondary{background:#292929;color:#fff}.danger{background:var(--danger);color:#fff}.success{background:var(--ok);color:#000}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
#status{margin:10px 0;padding:10px;border-radius:8px;display:none}
.status-ok{display:block!important;background:#12351f;color:#8ff0ad}.status-error{display:block!important;background:#3b1613;color:#ffaaa1}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.product{background:#0d0d0d;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.product img{width:100%;height:190px;object-fit:cover;background:#181818}
.pbody{padding:13px}.price{font-weight:900;font-size:18px;margin-top:5px}.old{text-decoration:line-through;color:#777;font-size:13px;margin-left:5px}
.badge{display:inline-block;background:var(--accent);color:#000;font-size:10px;font-weight:900;padding:5px 7px;border-radius:5px;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px}.empty{text-align:center;color:#888;padding:30px}
.login{max-width:430px;margin:8vh auto}.hidden{display:none!important}
.file{padding:10px;border:1px dashed #555;border-radius:8px;background:#0d0d0d}
@media(max-width:800px){.grid,.products{grid-template-columns:1fr}.wrap{padding:15px}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginView" class="login wrap">
  <div class="card">
    <div class="logo">VIBE <span>KICKS</span></div>
    <h2 style="margin-top:20px">Painel Admin</h2>
    <p class="muted">Entre com o usuário criado no Supabase Authentication.</p>
    <label>E-mail</label>
    <input id="loginEmail" type="email" placeholder="seu@email.com">
    <label style="margin-top:12px">Senha</label>
    <input id="loginPassword" type="password" placeholder="Sua senha">
    <div class="actions"><button class="btn primary" onclick="login()">ENTRAR</button></div>
    <div id="loginStatus"></div>
  </div>
</div>

<div id="app" class="hidden">
<div class="wrap">
<header>
  <div><div class="logo">VIBE <span>KICKS</span></div><div class="muted">Gerenciamento de produtos</div></div>
  <button class="btn secondary" onclick="logout()">SAIR</button>
</header>

<div class="card">
  <h2 id="formTitle">Adicionar produto</h2>
  <input id="productId" type="hidden">
  <div class="grid">
    <div><label>Nome do tênis *</label><input id="name" placeholder="Ex.: Nike Air Max"></div>
    <div><label>Preço *</label><input id="price" type="number" step="0.01" min="0" placeholder="299.90"></div>
    <div><label>Categoria</label>
      <select id="cat"><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="unissex">Unissex</option></select>
    </div>
    <div><label>Preço antigo (opcional)</label><input id="old" type="number" step="0.01" min="0" placeholder="349.90"></div>
    <div><label>Etiqueta</label>
      <select id="tag"><option value="">Sem etiqueta</option><option value="OFERTA">OFERTA</option><option value="NOVO">NOVO</option><option value="DESTAQUE">DESTAQUE</option></select>
    </div>
    <div><label>Foto do produto</label><input id="imageFile" class="file" type="file" accept="image/*"></div>
  </div>
  <div class="actions">
    <button class="btn primary" onclick="saveProduct()">SALVAR PRODUTO</button>
    <button class="btn secondary" onclick="clearForm()">LIMPAR</button>
  </div>
  <div id="status"></div>
</div>

<div class="card">
  <h2>Produtos cadastrados</h2>
  <div id="products" class="products"><div class="empty">Carregando...</div></div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ravaircmbkotndfghilq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C';
const TABLE = 'products';
const BUCKET = 'produtos';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];

const $ = id => document.getElementById(id);
const money = v => Number(v || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function status(message, ok=true){
  const el=$('status'); el.textContent=message;
  el.className=ok?'status-ok':'status-error';
}
function loginStatus(message,ok=false){
  const el=$('loginStatus'); el.textContent=message;
  el.style.cssText='display:block;margin-top:12px;padding:10px;border-radius:8px;background:'+(ok?'#12351f':'#3b1613')+';color:'+(ok?'#8ff0ad':'#ffaaa1');
}

async function login(){
  const email=$('loginEmail').value.trim(), password=$('loginPassword').value;
  if(!email||!password){loginStatus('Informe e-mail e senha.');return;}
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){loginStatus(error.message);return;}
  showApp();
}

async function logout(){await db.auth.signOut(); showLogin();}

async function checkSession(){
  const {data}=await db.auth.getSession();
  if(data.session) showApp(); else showLogin();
}
function showApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');loadProducts();}
function showLogin(){$('app').classList.add('hidden');$('loginView').classList.remove('hidden');}

function esc(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

async function loadProducts(){
  $('products').innerHTML='<div class="empty">Carregando produtos...</div>';
  const {data,error}=await db.from(TABLE).select('*').order('id',{ascending:false});
  if(error){$('products').innerHTML='<div class="empty">Erro: '+esc(error.message)+'</div>';return;}
  products=data||[]; renderProducts();
}

function renderProducts(){
  if(!products.length){$('products').innerHTML='<div class="empty">Nenhum produto cadastrado.</div>';return;}
  $('products').innerHTML=products.map(p=>{
    const img=p.image?`<img src="${esc(p.image)}" alt="${esc(p.Name||p.name||'Produto')}" onerror="this.style.display='none'">`:'<div style="height:190px;display:flex;align-items:center;justify-content:center;font-size:60px">👟</div>';
    const name=esc(p.Name||p.name||'Sem nome');
    return `<article class="product">${img}<div class="pbody">
      ${p.tag?`<span class="badge">${esc(p.tag)}</span>`:''}
      <div><strong>${name}</strong></div>
      <div class="muted">${esc(p.cat||'')}</div>
      <div class="price">${money(p.price)} ${p.old?`<span class="old">${money(p.old)}</span>`:''}</div>
      <div class="actions">
        <button class="btn secondary" onclick="editProduct(${Number(p.id)})">EDITAR</button>
        <button class="btn danger" onclick="deleteProduct(${Number(p.id)})">EXCLUIR</button>
      </div>
    </div></article>`;
  }).join('');
}

async function uploadImage(file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${crypto.randomUUID()}.${ext}`;
  const {error}=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
  if(error) throw error;
  const {data}=db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function saveProduct(){
  const id=$('productId').value;
  const name=$('name').value.trim();
  const price=Number($('price').value);
  const cat=$('cat').value;
  const oldVal=$('old').value===''?null:Number($('old').value);
  const tag=$('tag').value;
  const file=$('imageFile').files[0];

  if(!name||!Number.isFinite(price)){status('Preencha nome e preço.',false);return;}
  status('Salvando...',true);

  try{
    let image = null;
    if(file) image=await uploadImage(file);

    const payload={Name:name,price:price,cat:Cat,old:OldVal,tag:Tag};
    if(image) payload.image=image;

    let result;
    if(id){
      result=await db.from(TABLE).update(payload).eq('id',Number(id));
    }else{
      result=await db.from(TABLE).insert(payload);
    }
    if(result.error) throw result.error;

    status(id?'Produto atualizado com sucesso!':'Produto cadastrado com sucesso!',true);
    clearForm();
    await loadProducts();
  }catch(e){
    console.error(e);
    status('Erro: '+e.message,false);
  }
}

function editProduct(id){
  const p=products.find(x=>Number(x.id)===Number(id)); if(!p)return;
  $('productId').value=p.id;
  $('name').value=p.name||p.name||'';
  $('price').value=p.price??'';
  $('cat').value=p.cat||'masculino';
  $('old').value=p.old??'';
  $('tag').value=p.tag||'';
  $('imageFile').value='';
  $('formTitle').textContent='Editar produto';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteProduct(id){
  const p=products.find(x=>Number(x.id)===Number(id));
  if(!p)return;
  if(!confirm(`Excluir "${p.name||p.name||'este produto'}"?`))return;
  status('Excluindo...',true);
  const {error}=await db.from(TABLE).delete().eq('id',Number(id));
  if(error){status('Erro ao excluir: '+error.message,false);return;}
  status('Produto excluído.',true);
  await loadProducts();
}

function clearForm(){
  $('productId').value='';
  $('name').value='';
  $('price').value='';
  $('old').value='';
  $('cat').value='masculino';
  $('tag').value='';
  $('imageFile').value='';
  $('formTitle').textContent='Adicionar produto';
}

db.auth.onAuthStateChange((event,session)=>{
  if(session) showApp(); else showLogin();
});

checkSession();
</script>
</body>
</html>
