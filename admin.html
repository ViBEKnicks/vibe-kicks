<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIBE KICKS - Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0b0b;
  color:white;
}

header{
  background:#111;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #333;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#ffb000;
}

.loja{
  background:#222;
  color:white;
  text-decoration:none;
  padding:10px 15px;
  border-radius:8px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  margin-top:10px;
}

.botao-principal{
  width:100%;
  padding:16px;
  border:0;
  border-radius:10px;
  background:#ffb000;
  color:#000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:20px;
}

.formulario{
  display:none;
  background:#151515;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
  border:1px solid #333;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
  background:#222;
  color:white;
  font-size:16px;
}

input[type="file"]{
  padding:10px;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin-top:15px;
  border-radius:10px;
  background:#000;
  display:none;
}

.botoes{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.salvar{
  flex:1;
  padding:15px;
  border:0;
  border-radius:8px;
  background:#16a34a;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cancelar{
  flex:1;
  padding:15px;
  border:0;
  border-radius:8px;
  background:#444;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.produto{
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.produto img{
  width:100px;
  height:100px;
  object-fit:contain;
  background:#000;
  border-radius:8px;
}

.info{
  flex:1;
}

.nome{
  font-size:18px;
  font-weight:bold;
  margin-bottom:7px;
}

.preco{
  color:#ffb000;
  font-size:18px;
  font-weight:bold;
}

.categoria{
  color:#aaa;
  margin-top:5px;
}

.acoes{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.editar{
  background:#2563eb;
  color:white;
  border:0;
  padding:9px 12px;
  border-radius:7px;
  cursor:pointer;
}

.excluir{
  background:#dc2626;
  color:white;
  border:0;
  padding:9px 12px;
  border-radius:7px;
  cursor:pointer;
}

.status{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

.sucesso{
  display:block;
  background:#14532d;
  color:#bbf7d0;
}

.erro{
  display:block;
  background:#7f1d1d;
  color:#fecaca;
}

.carregando{
  text-align:center;
  color:#aaa;
  padding:20px;
}

@media(max-width:600px){

  .produto{
    align-items:flex-start;
  }

  .produto img{
    width:80px;
    height:80px;
  }

  .acoes{
    flex-direction:column;
  }

  .editar,
  .excluir{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    VIBE KICKS
  </div>

  <a class="loja" href="index.html">
    ← Loja
  </a>

</header>


<div class="container">

  <h1>Gerenciar Produtos</h1>

  <div id="status" class="status"></div>

  <button id="abrir" class="botao-principal">
    ➕ ADICIONAR PRODUTO
  </button>


  <div id="formulario" class="formulario">

    <h2 id="tituloFormulario">
      Novo Produto
    </h2>


    <label>
      Nome do produto
    </label>

    <input
      id="nome"
      type="text"
      placeholder="Ex: Air Jordan 1"
    >


    <label>
      Preço
    </label>

    <input
      id="preco"
      type="number"
      step="0.01"
      placeholder="Ex: 299.90"
    >


    <label>
      Preço antigo
    </label>

    <input
      id="precoAntigo"
      type="number"
      step="0.01"
      placeholder="Ex: 399.90"
    >


    <label>
      Categoria
    </label>

    <select id="categoria">

      <option value="">
        Selecione
      </option>

      <option value="Masculino">
        Masculino
      </option>

      <option value="Feminino">
        Feminino
      </option>

      <option value="Infantil">
        Infantil
      </option>

      <option value="Lançamento">
        Lançamento
      </option>

    </select>


    <label>
      Tag
    </label>

    <select id="tag">

      <option value="">
        Nenhuma
      </option>

      <option value="Novo">
        Novo
      </option>

      <option value="Oferta">
        Oferta
      </option>

      <option value="Mais vendido">
        Mais vendido
      </option>

    </select>


    <label>
      Foto do produto
    </label>

    <input
      id="foto"
      type="file"
      accept="image/*"
    >


    <img
      id="preview"
      class="preview"
      alt="Prévia da foto"
    >


    <div class="botoes">

      <button
        id="salvar"
        class="salvar"
        type="button"
      >
        💾 SALVAR PRODUTO
      </button>

      <button
        id="cancelar"
        class="cancelar"
        type="button"
      >
        CANCELAR
      </button>

    </div>

  </div>


  <h2>
    Produtos cadastrados
  </h2>

  <div id="lista">
    <div class="carregando">
      Carregando produtos...
    </div>
  </div>

</div>


<script>

/* ==============================
   CONFIGURAÇÃO SUPABASE
============================== */

var SUPABASE_URL =
  "https://ravaircmbkotndfghilq.supabase.co";

var SUPABASE_KEY =
  "sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

var BUCKET =
  "produtos";


/* ==============================
   VARIÁVEIS
============================== */

var produtoEditando = null;

var imagemAtual = "";


/* ==============================
   ELEMENTOS
============================== */

var abrir =
  document.getElementById("abrir");

var formulario =
  document.getElementById("formulario");

var cancelar =
  document.getElementById("cancelar");

var salvar =
  document.getElementById("salvar");

var foto =
  document.getElementById("foto");

var preview =
  document.getElementById("preview");

var lista =
  document.getElementById("lista");

var status =
  document.getElementById("status");


/* ==============================
   MENSAGEM
============================== */

function mostrarStatus(mensagem, tipo){

  status.innerText = mensagem;

  status.className =
    "status " + tipo;

}


/* ==============================
   ABRIR FORMULÁRIO
============================== */

abrir.addEventListener("click", function(){

  produtoEditando = null;

  imagemAtual = "";

  document.getElementById("tituloFormulario").innerText =
    "Novo Produto";

  document.getElementById("nome").value = "";

  document.getElementById("preco").value = "";

  document.getElementById("precoAntigo").value = "";

  document.getElementById("categoria").value = "";

  document.getElementById("tag").value = "";

  foto.value = "";

  preview.src = "";

  preview.style.display = "none";

  formulario.style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* ==============================
   CANCELAR
============================== */

cancelar.addEventListener("click", function(){

  formulario.style.display = "none";

  produtoEditando = null;

  imagemAtual = "";

});


/* ==============================
   PRÉVIA DA FOTO
============================== */

foto.addEventListener("change", function(){

  var arquivo = foto.files[0];

  if(!arquivo){
    return;
  }

  var leitor =
    new FileReader();

  leitor.onload =
    function(event){

      preview.src =
        event.target.result;

      preview.style.display =
        "block";

    };

  leitor.readAsDataURL(arquivo);

});


/* ==============================
   ENVIAR FOTO
============================== */

async function enviarFoto(){

  var arquivo =
    foto.files[0];

  /* Se não escolheu uma nova foto */
  if(!arquivo){

    return imagemAtual;

  }


  /* Verifica se é imagem */

  if(!arquivo.type.startsWith("image/")){

    throw new Error(
      "Escolha uma imagem válida."
    );

  }


  /* Limite de 6 MB */

  if(arquivo.size > 6 * 1024 * 1024){

    throw new Error(
      "A foto é muito grande. Escolha uma imagem de até 6 MB."
    );

  }


  /* Nome seguro */

  var nomeOriginal =
    arquivo.name
      .replace(/[^a-zA-Z0-9._-]/g,"-");


  var nomeArquivo =
    Date.now() +
    "-" +
    nomeOriginal;


  /* Endereço do Storage */

  var enderecoUpload =
    SUPABASE_URL +
    "/storage/v1/object/" +
    BUCKET +
    "/" +
    nomeArquivo;


  /* Envia imagem */

  var resposta =
    await fetch(
      enderecoUpload,
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            arquivo.type,
          "x-upsert":
            "true"
        },

        body:arquivo
      }
    );


  if(!resposta.ok){

    var erro =
      await resposta.text();

    console.error(
      "Erro Storage:",
      erro
    );

    throw new Error(
      "Não foi possível enviar a foto."
    );

  }


  /* URL pública */

  var urlPublica =
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    nomeArquivo;


  return urlPublica;

}


/* ==============================
   SALVAR PRODUTO
============================== */

salvar.addEventListener("click", async function(){

  try{

    salvar.disabled = true;

    salvar.innerText =
      "⏳ SALVANDO...";


    var nome =
      document.getElementById("nome").value.trim();


    var preco =
      document.getElementById("preco").value;


    var precoAntigo =
      document.getElementById("precoAntigo").value;


    var categoria =
      document.getElementById("categoria").value;


    var tag =
      document.getElementById("tag").value;


    /* Validações */

    if(!nome){

      throw new Error(
        "Digite o nome do produto."
      );

    }


    if(!preco){

      throw new Error(
        "Digite o preço."
      );

    }


    /* Foto */

    mostrarStatus(
      "Enviando foto...",
      "sucesso"
    );


    var imagem =
      await enviarFoto();


    /* Produto */

    var produto = {

      name:nome,

      price:Number(preco),

      Cat:
        categoria,

      Old:
        precoAntigo === ""
          ? null
          : Number(precoAntigo),

      Tag:
        tag,

      image:
        imagem

    };


    mostrarStatus(
      "Salvando produto...",
      "sucesso"
    );


    /* ==========================
       NOVO PRODUTO
    ========================== */

    if(produtoEditando === null){

      var resposta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products",
          {

            method:"POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify(produto)

          }
        );


      if(!resposta.ok){

        var erro =
          await resposta.text();

        console.error(erro);

        throw new Error(
          "Erro ao cadastrar produto."
        );

      }

    }


    /* ==========================
       EDITAR PRODUTO
    ========================== */

    else{

      var resposta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          produtoEditando,

          {

            method:"PATCH",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify(produto)

          }
        );


      if(!resposta.ok){

        var erro =
          await resposta.text();

        console.error(erro);

        throw new Error(
          "Erro ao editar produto."
        );

      }

    }


    mostrarStatus(
      "✅ Produto salvo com sucesso!",
      "sucesso"
    );


    formulario.style.display =
      "none";


    produtoEditando =
      null;


    imagemAtual =
      "";


    await carregarProdutos();


  }

  catch(erro){

    console.error(erro);

    mostrarStatus(
      "❌ " + erro.message,
      "erro"
    );

  }

  finally{

    salvar.disabled =
      false;

    salvar.innerText =
      "💾 SALVAR PRODUTO";

  }

});


/* ==============================
   CARREGAR PRODUTOS
============================== */

async function carregarProdutos(){

  try{

    lista.innerHTML =
      '<div class="carregando">Carregando produtos...</div>';


    var resposta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.asc",

        {

          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY

          }

        }
      );


    if(!resposta.ok){

      throw new Error(
        "Não foi possível carregar os produtos."
      );

    }


    var produtos =
      await resposta.json();


    lista.innerHTML = "";


    if(produtos.length === 0){

      lista.innerHTML =
        '<div class="carregando">Nenhum produto cadastrado.</div>';

      return;

    }


    produtos.forEach(
      function(produto){

        criarProdutoNaTela(
          produto
        );

      }
    );


  }

  catch(erro){

    console.error(erro);

    lista.innerHTML =
      '<div class="status erro">Erro ao carregar produtos.</div>';

  }

}


/* ==============================
   CRIAR CARD
============================== */

function criarProdutoNaTela(produto){

  var div =
    document.createElement("div");

  div.className =
    "produto";


  var imagem =
    document.createElement("img");


  imagem.src =
    produto.image || "";


  imagem.onerror =
    function(){

      imagem.style.display =
        "none";

    };


  var info =
    document.createElement("div");

  info.className =
    "info";


  var nome =
    document.createElement("div");

  nome.className =
    "nome";

  nome.innerText =
    produto.name || "Sem nome";


  var preco =
    document.createElement("div");

  preco.className =
    "preco";

  preco.innerText =
    "R$ " +
    Number(produto.price || 0)
      .toFixed(2)
      .replace(".",",");


  var categoria =
    document.createElement("div");

  categoria.className =
    "categoria";

  categoria.innerText =
    "Categoria: " +
    (produto.Cat || "-");


  var tag =
    document.createElement("div");

  tag.className =
    "categoria";

  tag.innerText =
    "Tag: " +
    (produto.Tag || "Nenhuma");


  var acoes =
    document.createElement("div");

  acoes.className =
    "acoes";


  var editar =
    document.createElement("button");

  editar.className =
    "editar";

  editar.innerText =
    "✏️ Editar";


  editar.addEventListener(
    "click",
    function(){

      editarProduto(produto);

    }
  );


  var excluir =
    document.createElement("button");

  excluir.className =
    "excluir";

  excluir.innerText =
    "🗑️ Excluir";


  excluir.addEventListener(
    "click",
    function(){

      excluirProduto(produto.id);

    }
  );


  acoes.appendChild(
    editar
  );

  acoes.appendChild(
    excluir
  );


  info.appendChild(
    nome
  );

  info.appendChild(
    preco
  );

  info.appendChild(
    categoria
  );

  info.appendChild(
    tag
  );

  info.appendChild(
    acoes
  );


  div.appendChild(
    imagem
  );

  div.appendChild(
    info
  );


  lista.appendChild(
    div
  );

}


/* ==============================
   EDITAR
============================== */

function editarProduto(produto){

  produtoEditando =
    produto.id;


  imagemAtual =
    produto.image || "";


  document.getElementById(
    "tituloFormulario"
  ).innerText =
    "Editar Produto";


  document.getElementById(
    "nome"
  ).value =
    produto.name || "";


  document.getElementById(
    "preco"
  ).value =
    produto.price || "";


  document.getElementById(
    "precoAntigo"
  ).value =
    produto.Old || "";


  document.getElementById(
    "categoria"
  ).value =
    produto.Cat || "";


  document.getElementById(
    "tag"
  ).value =
    produto.Tag || "";


  foto.value = "";


  if(produto.image){

    preview.src =
      produto.image;

    preview.style.display =
      "block";

  }

  else{

    preview.src = "";

    preview.style.display =
      "none";

  }


  formulario.style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==============================
   EXCLUIR
============================== */

async function excluirProduto(id){

  var confirmar =
    confirm(
      "Tem certeza que deseja excluir este produto?"
    );


  if(!confirmar){
    return;
  }


  try{

    mostrarStatus(
      "Excluindo produto...",
      "sucesso"
    );


    var resposta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,

        {

          method:"DELETE",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY,

            "Prefer":
              "return=representation"

          }

        }
      );


    if(!resposta.ok){

      var erro =
        await resposta.text();

      console.error(erro);

      throw new Error(
        "Não foi possível excluir."
      );

    }


    mostrarStatus(
      "✅ Produto excluído!",
      "sucesso"
    );


    await carregarProdutos();

  }

  catch(erro){

    console.error(erro);

    mostrarStatus(
      "❌ " + erro.message,
      "erro"
    );

  }

}


/* ==============================
   INICIAR
============================== */

carregarProdutos();

</script>

</body>
</html>
