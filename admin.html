<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Vibe Kicks</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:#fff;
}

header{
background:#181818;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #333;
}

.logo{
font-size:25px;
font-weight:bold;
color:#ffb000;
}

.voltar{
color:#fff;
text-decoration:none;
background:#333;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.status{
background:#153d1e;
color:#5cff78;
padding:15px;
border-radius:10px;
margin-bottom:20px;
text-align:center;
font-weight:bold;
}

.botao-adicionar{
width:100%;
padding:16px;
border:0;
border-radius:10px;
background:#ffb000;
color:#111;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-bottom:20px;
}

.formulario{
display:none;
background:#1b1b1b;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

.formulario.aberto{
display:block;
}

h2{
margin-top:0;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input,
select{
width:100%;
padding:13px;
border-radius:8px;
border:1px solid #444;
background:#252525;
color:#fff;
font-size:16px;
}

.botao-foto{
display:block;
width:100%;
padding:15px;
margin-top:8px;
background:#333;
border:2px dashed #ffb000;
border-radius:10px;
color:#fff;
font-size:16px;
font-weight:bold;
text-align:center;
cursor:pointer;
}

#foto{
display:none;
}

.previa{
display:none;
margin-top:15px;
text-align:center;
}

.previa img{
width:180px;
height:180px;
object-fit:contain;
background:#fff;
border-radius:10px;
padding:5px;
}

.nome-arquivo{
margin-top:8px;
color:#aaa;
font-size:13px;
word-break:break-word;
}

.botoes{
display:flex;
gap:10px;
margin-top:20px;
}

.salvar{
flex:1;
padding:15px;
background:#22c55e;
border:0;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.cancelar{
padding:15px;
background:#555;
color:#fff;
border:0;
border-radius:8px;
cursor:pointer;
}

.mensagem{
margin-top:15px;
padding:12px;
border-radius:8px;
display:none;
word-break:break-word;
}

.produto{
background:#1b1b1b;
padding:15px;
border-radius:12px;
margin-bottom:15px;
display:flex;
gap:15px;
align-items:center;
}

.produto img{
width:100px;
height:100px;
object-fit:contain;
background:#fff;
border-radius:8px;
}

.info{
flex:1;
}

.nome-produto{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.preco{
color:#ffb000;
font-size:18px;
font-weight:bold;
}

.categoria{
color:#aaa;
margin-top:5px;
}

.etiqueta{
display:inline-block;
margin-top:7px;
background:#ffb000;
color:#111;
padding:4px 8px;
border-radius:5px;
font-size:12px;
font-weight:bold;
}

.acoes{
display:flex;
gap:8px;
margin-top:10px;
}

.editar{
background:#2563eb;
color:#fff;
border:0;
padding:9px 12px;
border-radius:7px;
cursor:pointer;
}

.excluir{
background:#dc2626;
color:#fff;
border:0;
padding:9px 12px;
border-radius:7px;
cursor:pointer;
}

.vazio{
text-align:center;
padding:30px;
color:#aaa;
}

@media(max-width:600px){

.produto{
align-items:flex-start;
}

.produto img{
width:80px;
height:80px;
}

.nome-produto{
font-size:16px;
}

.preco{
font-size:16px;
}

.botoes{
flex-direction:column;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
VIBE KICKS
</div>

<a class="voltar" href="index.html">
← Loja
</a>

</header>


<div class="container">

<div class="status">
✅ PAINEL VIBE KICKS ONLINE
</div>


<button
class="botao-adicionar"
id="abrir"
type="button"
>
➕ ADICIONAR PRODUTO
</button>


<div
class="formulario"
id="formulario"
>

<h2 id="tituloFormulario">
Adicionar produto
</h2>


<label>
Nome do produto
</label>

<input
type="text"
id="nome"
placeholder="Ex: Nike Air Max"
>


<label>
Preço
</label>

<input
type="number"
id="preco"
placeholder="Ex: 399.90"
step="0.01"
>


<label>
Preço antigo
</label>

<input
type="number"
id="precoAntigo"
placeholder="Ex: 499.90"
step="0.01"
>


<label>
Categoria
</label>

<select id="categoria">

<option value="Tênis">
Tênis
</option>

<option value="Masculino">
Masculino
</option>

<option value="Feminino">
Feminino
</option>

<option value="Infantil">
Infantil
</option>

</select>


<label>
Etiqueta
</label>

<select id="tag">

<option value="">
Sem etiqueta
</option>

<option value="NOVO">
NOVO
</option>

<option value="OFERTA">
OFERTA
</option>

<option value="DESTAQUE">
DESTAQUE
</option>

</select>


<label>
Foto do produto
</label>


<label
for="foto"
class="botao-foto"
>
📷 ESCOLHER FOTO DO CELULAR
</label>

<input
type="file"
id="foto"
accept="image/*"
>


<div
class="previa"
id="previa"
>

<img
id="imagemPrevia"
src=""
alt="Prévia"
>

<div
class="nome-arquivo"
id="nomeArquivo"
></div>

</div>


<div class="botoes">

<button
class="salvar"
id="salvar"
type="button"
>
💾 SALVAR PRODUTO
</button>

<button
class="cancelar"
id="cancelar"
type="button"
>
CANCELAR
</button>

</div>


<div
class="mensagem"
id="mensagem"
></div>

</div>


<h2>
📦 Produtos cadastrados
</h2>


<div id="lista">
Carregando produtos...
</div>

</div>


<script>

/* =========================================
   CONFIGURAÇÃO SUPABASE
========================================= */

var SUPABASE_URL =
"https://ravaircmbkotndfghilq.supabase.co";

var SUPABASE_KEY =
"sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

var BUCKET =
"produtos";

var editandoId = null;

var imagemAtual = "";


/* =========================================
   ELEMENTOS
========================================= */

var abrir =
document.getElementById("abrir");

var formulario =
document.getElementById("formulario");

var cancelar =
document.getElementById("cancelar");

var salvar =
document.getElementById("salvar");

var foto =
document.getElementById("foto");

var previa =
document.getElementById("previa");

var imagemPrevia =
document.getElementById("imagemPrevia");

var nomeArquivo =
document.getElementById("nomeArquivo");

var mensagem =
document.getElementById("mensagem");

var lista =
document.getElementById("lista");

var tituloFormulario =
document.getElementById("tituloFormulario");


/* =========================================
   ESCOLHER FOTO
========================================= */

foto.onchange = function(){

var arquivo = foto.files[0];

if(!arquivo){

return;

}

imagemPrevia.src =
URL.createObjectURL(arquivo);

nomeArquivo.innerText =
arquivo.name;

previa.style.display =
"block";

};


/* =========================================
   ABRIR
========================================= */

abrir.onclick = function(){

editandoId = null;

imagemAtual = "";

tituloFormulario.innerText =
"Adicionar produto";

limparFormulario();

mensagem.style.display =
"none";

previa.style.display =
"none";

formulario.classList.add(
"aberto"
);

window.scrollTo(0,0);

};


/* =========================================
   CANCELAR
========================================= */

cancelar.onclick = function(){

formulario.classList.remove(
"aberto"
);

editandoId = null;

imagemAtual = "";

limparFormulario();

mensagem.style.display =
"none";

previa.style.display =
"none";

};


/* =========================================
   LIMPAR
========================================= */

function limparFormulario(){

document.getElementById("nome").value =
"";

document.getElementById("preco").value =
"";

document.getElementById("precoAntigo").value =
"";

document.getElementById("categoria").value =
"Tênis";

document.getElementById("tag").value =
"";

foto.value = "";

imagemPrevia.src = "";

nomeArquivo.innerText = "";

}


/* =========================================
   MENSAGEM
========================================= */

function mostrarMensagem(
texto,
sucesso
){

mensagem.style.display =
"block";

mensagem.innerText =
texto;

if(sucesso){

mensagem.style.background =
"#153d1e";

mensagem.style.color =
"#5cff78";

}else{

mensagem.style.background =
"#451515";

mensagem.style.color =
"#ff7777";

}

}


/* =========================================
   ENVIAR FOTO PARA SUPABASE
========================================= */

async function enviarFoto(){

var arquivo =
foto.files[0];

if(!arquivo){

return imagemAtual;

}


/* Nome único para evitar conflito */

var nomeSeguro =
arquivo.name
.replace(/[^a-zA-Z0-9._-]/g,"-");

var nomeArquivoFinal =
Date.now() +
"-" +
nomeSeguro;


var resposta =
await fetch(

SUPABASE_URL +
"/storage/v1/object/" +
BUCKET +
"/" +
nomeArquivoFinal,

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
arquivo.type,

"x-upsert":
"true"

},

body:
arquivo

}

);


if(!resposta.ok){

var erro =
await resposta.text();

throw new Error(
"Erro ao enviar foto: " +
erro
);

}


/* URL pública */

var urlPublica =
SUPABASE_URL +
"/storage/v1/object/public/" +
BUCKET +
"/" +
nomeArquivoFinal;


return urlPublica;

}


/* =========================================
   SALVAR PRODUTO
========================================= */

salvar.onclick =
async function(){

var nome =
document.getElementById("nome")
.value
.trim();

var preco =
document.getElementById("preco")
.value;

var precoAntigo =
document.getElementById("precoAntigo")
.value;

var categoria =
document.getElementById("categoria")
.value;

var tag =
document.getElementById("tag")
.value;


if(nome === ""){

mostrarMensagem(
"Digite o nome do produto.",
false
);

return;

}


if(preco === ""){

mostrarMensagem(
"Digite o preço.",
false
);

return;

}


/* Se for produto novo, precisa escolher foto */

if(
editandoId === null &&
!foto.files[0]
){

mostrarMensagem(
"Escolha uma foto do celular.",
false
);

return;

}


salvar.disabled = true;

salvar.innerText =
"📤 ENVIANDO...";


try{

/* Envia a foto */

if(foto.files[0]){

imagemAtual =
await enviarFoto();

}


/* Dados do produto */

var produto = {

name: nome,

price: Number(preco),

Cat: categoria,

Old:
precoAntigo === ""
? null
: Number(precoAntigo),

Tag: tag,

image: imagemAtual

};


salvar.innerText =
"💾 SALVANDO...";


var resposta;


/* NOVO */

if(editandoId === null){

resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(produto)

}

);


/* EDITAR */

}else{

resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
editandoId,

{

method:"PATCH",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(produto)

}

}


var resultado =
await resposta.text();


if(!resposta.ok){

throw new Error(
resultado
);

}


/* SUCESSO */

formulario.classList.remove(
"aberto"
);

editandoId = null;

imagemAtual = "";

limparFormulario();

previa.style.display =
"none";


await carregarProdutos();


alert(
"✅ Produto salvo com sucesso!"
);


}catch(erro){

console.error(erro);

mostrarMensagem(

"❌ Erro ao salvar: " +
erro.message,

false

);

}


salvar.disabled = false;

salvar.innerText =
"💾 SALVAR PRODUTO";

};


/* =========================================
   CARREGAR PRODUTOS
========================================= */

async function carregarProdutos(){

lista.innerHTML =
"Carregando produtos...";


try{

var resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?select=*&order=id.asc",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


var produtos =
await resposta.json();


lista.innerHTML =
"";


if(produtos.length === 0){

lista.innerHTML =
'<div class="vazio">' +
"Nenhum produto cadastrado." +
"</div>";

return;

}


for(
var i = 0;
i < produtos.length;
i++
){

criarProduto(
produtos[i]
);

}


}catch(erro){

console.error(erro);

lista.innerHTML =
'<div class="vazio">' +
"❌ Erro ao carregar produtos." +
"<br><br>" +
erro.message +
"</div>";

}

}


/* =========================================
   CRIAR CARD
========================================= */

function criarProduto(
produto
){

var card =
document.createElement("div");

card.className =
"produto";


/* IMAGEM */

var imagem =
document.createElement("img");

imagem.src =
produto.image || "";

imagem.alt =
produto.name || "Produto";


imagem.onerror =
function(){

this.style.display =
"none";

};


/* INFO */

var info =
document.createElement("div");

info.className =
"info";


/* NOME */

var nome =
document.createElement("div");

nome.className =
"nome-produto";

nome.innerText =
produto.name ||
"Sem nome";


/* PREÇO */

var preco =
document.createElement("div");

preco.className =
"preco";

preco.innerText =
formatarPreco(
produto.price
);


/* CATEGORIA */

var categoria =
document.createElement("div");

categoria.className =
"categoria";

categoria.innerText =
"Categoria: " +
(
produto.Cat ||
"-"
);


/* TAG */

if(produto.Tag){

var etiqueta =
document.createElement("div");

etiqueta.className =
"etiqueta";

etiqueta.innerText =
produto.Tag;

info.appendChild(
etiqueta
);

}


/* AÇÕES */

var acoes =
document.createElement("div");

acoes.className =
"acoes";


/* EDITAR */

var editar =
document.createElement("button");

editar.type =
"button";

editar.className =
"editar";

editar.innerText =
"✏️ EDITAR";


editar.onclick =
function(){

editarProduto(
produto
);

};


/* EXCLUIR */

var excluir =
document.createElement("button");

excluir.type =
"button";

excluir.className =
"excluir";

excluir.innerText =
"🗑️ EXCLUIR";


excluir.onclick =
function(){

excluirProduto(
produto.id
);

};


acoes.appendChild(
editar
);

acoes.appendChild(
excluir
);


info.appendChild(
nome
);

info.appendChild(
preco
);

info.appendChild(
categoria
);

info.appendChild(
acoes
);


card.appendChild(
imagem
);

card.appendChild(
info
);


lista.appendChild(
card
);

}


/* =========================================
   EDITAR
========================================= */

function editarProduto(
produto
){

editandoId =
produto.id;


imagemAtual =
produto.image || "";


tituloFormulario.innerText =
"Editar produto";


document.getElementById("nome")
.value =
produto.name || "";


document.getElementById("preco")
.value =
produto.price || "";


document.getElementById("precoAntigo")
.value =
produto.Old || "";


document.getElementById("categoria")
.value =
produto.Cat || "Tênis";


document.getElementById("tag")
.value =
produto.Tag || "";


/* Mostrar imagem atual */

if(produto.image){

imagemPrevia.src =
produto.image;

nomeArquivo.innerText =
"Foto atual";

previa.style.display =
"block";

}else{

previa.style.display =
"none";

}


mensagem.style.display =
"none";


formulario.classList.add(
"aberto"
);


window.scrollTo(0,0);

}


/* =========================================
   EXCLUIR
========================================= */

async function excluirProduto(
id
){

var confirmar =
confirm(
"Tem certeza que deseja excluir este produto?"
);


if(!confirmar){

return;

}


try{

var resposta =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
id,

{

method:"DELETE",

headers:{

"apikey":
SUPABASE_KEY,

"Prefer":
"return=representation"

}

}

);


if(!resposta.ok){

throw new Error(
await resposta.text()
);

}


alert(
"✅ Produto excluído com sucesso!"
);


carregarProdutos();


}catch(erro){

console.error(erro);

alert(
"❌ Erro ao excluir: " +
erro.message
);

}

}


/* =========================================
   FORMATAÇÃO DE PREÇO
========================================= */

function formatarPreco(
valor
){

return Number(
valor || 0
)
.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


/* =========================================
   INICIAR
========================================= */

carregarProdutos();

</script>

</body>
</html>
