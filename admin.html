body {

.usuario {

@media(max-width:600px) {

    .produto {

</head>

<body>

<header>

    <div>
        <h1>VIBE KICKS</h1>
        <div class="usuario" id="usuario"></div>
    </div>

    <div>
        <button onclick="irParaLoja()">← Loja</button>
        <button onclick="sair()">🚪 Sair</button>
    </div>

</header>

<div class="container">

    <div class="box">

        <h2 id="tituloFormulario">Adicionar produto</h2>

        <form id="produtoForm">

            <label>Nome do produto</label>
            <input
                type="text"
                id="nome"
                placeholder="Ex: Nike Air Max"
                required
            >

            <input

                id="preco"
                step="0.01"
                placeholder="Ex: 299.90"

            >

            <input

                id="categoria"
                placeholder="Ex: Nike"
            >

            <label>Preço antigo</label>
            <input
                type="number"
                id="precoAntigo"
                step="0.01"
                placeholder="Ex: 399.90"

            <input

                id="tag"

            Carregando produtos...
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://ravaircmbkotndfghilq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yL40T2sEFQBtKwISbLrY9Q_EHqvb23C";

const BUCKET = "produtos";


let accessToken =
localStorage.getItem("vibe_access_token");

let produtoEditando = null;

let imagemAtual = "";



/* =========================
   VERIFICAR LOGIN
========================= */

async function verificarLogin() {

    if (!accessToken) {

        window.location.href = "login.html";
        return false;

    }

    try {

        const resposta = await fetch(
            SUPABASE_URL + "/auth/v1/user",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + accessToken
                }
            }
        );

        if (!resposta.ok) {

            localStorage.removeItem("vibe_access_token");
            localStorage.removeItem("vibe_refresh_token");
            localStorage.removeItem("vibe_user_email");

            window.location.href = "login.html";

            return false;
        }

        const usuario = await resposta.json();

        document.getElementById("usuario").textContent =
            usuario.email || "";

        return true;

    } catch (erro) {

        console.error(erro);

        window.location.href = "login.html";

        return false;
    }
}



/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(texto, tipo = "normal") {

    const elemento =
        document.getElementById("mensagem");

    elemento.style.display = "block";

    elemento.textContent = texto;

    if (tipo === "erro") {

        elemento.style.background = "#5b1b1b";
        elemento.style.color = "#fff";

    } else {

        elemento.style.background = "#234d23";
        elemento.style.color = "#fff";
    }
}



/* =========================
   PREVIEW DA FOTO
========================= */

document
.getElementById("foto")
.addEventListener("change", function() {

    const arquivo = this.files[0];

    if (!arquivo) {

        document.getElementById("preview")
            .style.display = "none";

        return;
    }

    const leitor = new FileReader();

    leitor.onload = function(evento) {

        document.getElementById("previewImg")
            .src = evento.target.result;

        document.getElementById("preview")
            .style.display = "block";
    };

    leitor.readAsDataURL(arquivo);

});



/* =========================
   ENVIAR FOTO
========================= */

async function enviarFoto() {

    const foto =
        document.getElementById("foto");

    const arquivo = foto.files[0];


    // Se não escolheu foto
    if (!arquivo) {

        return imagemAtual || "";
    }


    if (!arquivo.type.startsWith("image/")) {

        throw new Error(
            "Escolha uma imagem válida."
        );
    }


    if (arquivo.size > 6 * 1024 * 1024) {

        throw new Error(
            "A foto deve ter no máximo 6 MB."
        );
    }


    const nomeOriginal =
        arquivo.name
        .replace(/[^a-zA-Z0-9._-]/g, "-");


    const nomeArquivo =
        Date.now() + "-" + nomeOriginal;


    const resposta = await fetch(

        SUPABASE_URL +
        "/storage/v1/object/" +
        BUCKET +
        "/" +
        nomeArquivo,

        {
            method: "POST",

            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " + accessToken,

                "Content-Type":
                    arquivo.type,

                "x-upsert":
                    "true"
            },

            body: arquivo
        }
    );


    if (!resposta.ok) {

        const erro =
            await resposta.text();

        console.error(
            "Erro no upload:",
            erro
        );

        throw new Error(
            "Erro ao enviar foto: " + erro
        );
    }


    return (

        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUCKET +
        "/" +
        nomeArquivo

    );
}



/* =========================
   SALVAR PRODUTO
========================= */

async function salvarProduto(evento) {

    if (evento) {

        evento.preventDefault();
        evento.stopPropagation();

    }


    const botao =
        document.getElementById("salvarBtn");


    try {

        botao.disabled = true;

        botao.textContent =
            "⏳ SALVANDO...";


        mostrarMensagem(
            "Salvando produto..."
        );


        const nome =
            document
            .getElementById("nome")
            .value
            .trim();


        const preco =
            document
            .getElementById("preco")
            .value;


        const categoria =
            document
            .getElementById("categoria")
            .value
            .trim();


        const precoAntigo =
            document
            .getElementById("precoAntigo")
            .value;


        const tag =
            document
            .getElementById("tag")
            .value
            .trim();


        if (!nome) {

            throw new Error(
                "Digite o nome do produto."
            );
        }


        if (!preco) {

            throw new Error(
                "Digite o preço do produto."
            );
        }


        /* FOTO */

        const imagem =
            await enviarFoto();


        /* PRODUTO */

        const produto = {

            name: nome,

            price: Number(preco),

            Cat: categoria,

            Old:
                precoAntigo === ""
                ? null
                : Number(precoAntigo),

            Tag: tag,

            image: imagem
        };


        let resposta;


        /* =========================
           EDITAR
        ========================= */

        if (produtoEditando) {

            resposta = await fetch(

                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                produtoEditando,

                {

                    method: "PATCH",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:
                        JSON.stringify(produto)
                }
            );

        }


        /* =========================
           ADICIONAR
        ========================= */

        else {

            resposta = await fetch(

                SUPABASE_URL +
                "/rest/v1/products",

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:
                        JSON.stringify(produto)
                }
            );

        }


        /* =========================
           VERIFICAR ERRO
        ========================= */

        if (!resposta.ok) {

            const erro =
                await resposta.text();

            console.error(
                "Resposta Supabase:",
                erro
            );

            throw new Error(
                erro || "Erro ao salvar produto."
            );
        }


        mostrarMensagem(
            produtoEditando
            ? "✅ Produto atualizado com sucesso!"
            : "✅ Produto cadastrado com sucesso!"
        );


        limparFormulario();

        await carregarProdutos();


    } catch (erro) {

        console.error(erro);

        mostrarMensagem(
            "❌ " +
            (erro.message ||
            "Erro ao salvar produto."),
            "erro"
        );


    } finally {

        botao.disabled = false;

        botao.textContent =
            produtoEditando
            ? "ATUALIZAR PRODUTO"
            : "SALVAR PRODUTO";

    }

}



/* =========================
   FORM SUBMIT
========================= */

document
.getElementById("produtoForm")
.addEventListener(
    "submit",
    salvarProduto
);



/* =========================
   CARREGAR PRODUTOS
========================= */

async function carregarProdutos() {

    const lista =
        document.getElementById(
            "listaProdutos"
        );


    try {

        const resposta =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/products?select=*&order=id.asc",

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken
                    }
                }
            );


        if (!resposta.ok) {

            const erro =
                await resposta.text();

            throw new Error(erro);
        }


        const produtos =
            await resposta.json();


        if (!produtos.length) {

            lista.innerHTML =
                "<p>Nenhum produto cadastrado.</p>";

            return;
        }


        lista.innerHTML = "";


        produtos.forEach(
            function(produto) {

                const div =
                    document.createElement("div");

                div.className =
                    "produto";


                const preco =
                    Number(produto.price || 0)
                    .toLocaleString(
                        "pt-BR",
                        {
                            style: "currency",
                            currency: "BRL"
                        }
                    );


                const precoAntigo =
                    produto.Old
                    ? Number(produto.Old)
                        .toLocaleString(
                            "pt-BR",
                            {
                                style: "currency",
                                currency: "BRL"
                            }
                        )
                    : "";


                div.innerHTML = `

                    <img
                        src="${produto.image || ""}"
                        onerror="this.style.display='none'"
                    >

                    <div class="produto-info">

                        <h3>
                            ${escaparHTML(produto.name || "")}
                        </h3>

                        <p>
                            ${escaparHTML(produto.Cat || "")}
                        </p>

                        <p>
                            <strong>
                                ${preco}
                            </strong>

                            ${
                                precoAntigo
                                ? `<s>${precoAntigo}</s>`
                                : ""
                            }
                        </p>

                        ${
                            produto.Tag
                            ? `<p>🏷️ ${escaparHTML(produto.Tag)}</p>`
                            : ""
                        }

                        <div class="acoes">

                            <button
                                class="editar"
                                onclick="editarProduto(${produto.id})"
                            >
                                ✏️ EDITAR
                            </button>

                            <button
                                class="excluir"
                                onclick="excluirProduto(${produto.id})"
                            >
                                🗑️ EXCLUIR
                            </button>

                        </div>

                    </div>
                `;


                lista.appendChild(div);

            }
        );


    } catch (erro) {

        console.error(erro);

        lista.innerHTML =
            "<p>❌ Erro ao carregar produtos.</p>";
    }

}
